<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Guild Hall · Household Command Center</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --tina:#7B4FBF;--tina-glow:rgba(123,79,191,0.25);--tina-soft:rgba(123,79,191,0.08);
  --mark:#2E7D52;--mark-glow:rgba(46,125,82,0.25);--mark-soft:rgba(46,125,82,0.08);
  --connor:#C4501A;--connor-glow:rgba(196,80,26,0.25);--connor-soft:rgba(196,80,26,0.08);
  --walker:#1A6FA8;--walker-glow:rgba(26,111,168,0.25);--walker-soft:rgba(26,111,168,0.08);
  --gabe:#8A7320;--gabe-glow:rgba(138,115,32,0.25);--gabe-soft:rgba(138,115,32,0.08);
  --bg:#0e0d0b;--surface:#141210;--card:#1c1914;
  --border:rgba(200,180,140,0.1);--border-hi:rgba(200,180,140,0.25);
  --text:#e8e0d0;--text-dim:#8a7f6e;--text-faint:#4a4438;
  --gold:#c8a84a;--gold-dim:rgba(200,168,74,0.12);
  --red:#c0392b;--red-soft:rgba(192,57,43,0.12);
  --success:#27ae60;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Crimson Text',Georgia,serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:16px;line-height:1.5;overflow-x:hidden}

.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:14px}
.loading-title{font-family:'Cinzel',serif;font-size:22px;color:var(--gold);letter-spacing:0.12em}
.loading-sub{font-size:13px;color:var(--text-dim);font-style:italic}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.app-header{position:sticky;top:0;z-index:100;background:rgba(14,13,11,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px}
.header-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;height:54px}
.app-logo{font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:0.12em;color:var(--gold);text-transform:uppercase;flex-shrink:0}
.app-logo span{color:var(--text-dim);font-weight:400;font-size:10px}
.sync-wrap{display:flex;align-items:center;gap:5px;margin-left:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);transition:background 0.3s}
.sync-dot.synced{background:var(--success)}.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite}.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.sync-lbl{font-size:10px;color:var(--text-faint);font-family:'Cinzel',serif;letter-spacing:0.06em}
.header-date{margin-left:auto;font-size:10px;color:var(--text-dim);font-family:'Cinzel',serif;letter-spacing:0.05em;text-align:right}

.nav-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:54px;z-index:99}
.nav-scroll::-webkit-scrollbar{display:none}
.nav-inner{display:flex;gap:4px;padding:7px 14px;width:max-content;min-width:100%}
.nav-pill{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:5px 14px;border-radius:18px;border:1px solid var(--border);color:var(--text-dim);background:transparent;cursor:pointer;white-space:nowrap;transition:all 0.2s;flex-shrink:0}
.nav-pill:hover{border-color:var(--border-hi);color:var(--text)}
.nav-pill.active{color:white;border-color:transparent}
.nav-pill[data-p="tina"].active{background:var(--tina);box-shadow:0 0 10px var(--tina-glow)}
.nav-pill[data-p="mark"].active{background:var(--mark);box-shadow:0 0 10px var(--mark-glow)}
.nav-pill[data-p="connor"].active{background:var(--connor);box-shadow:0 0 10px var(--connor-glow)}
.nav-pill[data-p="walker"].active{background:var(--walker);box-shadow:0 0 10px var(--walker-glow)}
.nav-pill[data-p="gabe"].active{background:var(--gabe);box-shadow:0 0 10px var(--gabe-glow)}
.nav-pill[data-p="command"].active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
.nav-pill[data-p="chores"].active{background:rgba(200,168,74,0.16);border-color:rgba(200,168,74,0.5);color:var(--gold)}
.nav-pill[data-p="projects"].active{background:rgba(123,79,191,0.16);border-color:rgba(123,79,191,0.5);color:#a880d8}
.nav-pill[data-p="shop"].active{background:rgba(46,125,82,0.16);border-color:rgba(46,125,82,0.5);color:#5cb085}
.nav-divider{width:1px;background:var(--border);margin:4px 4px;flex-shrink:0}

.tab-wrap{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:98px;z-index:98}
.tab-wrap.hidden{display:none}
.tab-bar{max-width:860px;margin:0 auto;display:flex}
.tab-btn{flex:1;padding:10px 6px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-dim);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}
.tab-btn.active{color:var(--text);border-bottom-color:var(--gold)}
.tab-btn:hover{color:var(--text)}

.main{max-width:860px;margin:0 auto;padding:16px 14px 80px}
.tab-panel{display:none;animation:fadeIn 0.2s ease}
.tab-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.person-hero{border-radius:var(--radius);padding:16px;margin-bottom:16px;border:1px solid var(--border)}
.hero-name{font-family:'Cinzel',serif;font-size:22px;font-weight:700;letter-spacing:0.04em}
.hero-role{font-size:12px;color:var(--text-dim);margin-top:1px;font-style:italic}
.hero-stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stat-box{background:rgba(0,0,0,0.3);border-radius:6px;padding:7px 12px;text-align:center;flex:1;min-width:55px;border:1px solid rgba(255,255,255,0.05)}
.stat-val{font-family:'Cinzel',serif;font-size:18px;font-weight:700;line-height:1}
.stat-lbl{font-size:8px;color:var(--text-dim);letter-spacing:0.1em;text-transform:uppercase;margin-top:2px}

.sec-head{display:flex;align-items:center;gap:8px;margin:16px 0 8px;transition:opacity 0.3s}
.sec-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;transition:color 0.3s,text-shadow 0.3s}
.sec-line{flex:1;height:1px;background:var(--border);transition:background 0.3s,opacity 0.3s}
.sec-count{font-family:'Cinzel',serif;font-size:9px;color:var(--text-faint)}
.sec-head.now .sec-lbl{color:var(--gold);text-shadow:0 0 8px var(--gold-dim)}
.sec-head.now .sec-line{background:linear-gradient(90deg,var(--gold),transparent);opacity:0.6}
.sec-head.dim{opacity:0.45}
.sec-head.dim .sec-lbl{color:var(--text-faint)}

.task-card{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;user-select:none;transition:border-color 0.15s,opacity 0.3s}
.task-card:active{opacity:0.7}
.task-card.done{opacity:0.45}
.task-card.dim{opacity:0.3}
.task-inner{display:flex;align-items:center;gap:10px;padding:11px 13px}
.task-check{width:20px;height:20px;border-radius:4px;flex-shrink:0;border:2px solid var(--border-hi);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.15s}
.task-check.pop{animation:checkPop 380ms cubic-bezier(0.34,1.56,0.64,1)}
@keyframes checkPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.task-text{flex:1;font-size:13.5px;line-height:1.3}
.task-card.done .task-text{text-decoration:line-through;color:var(--text-dim)}
.rollover-badge{font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.06em;color:#e74c3c;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.25);border-radius:8px;padding:1px 6px;flex-shrink:0}
.bonus-badge{font-family:'Cinzel',serif;font-size:9px;font-weight:700;letter-spacing:0.04em;color:var(--gold);background:var(--gold-dim);border:1px solid rgba(200,168,74,0.4);border-radius:8px;padding:1px 7px;flex-shrink:0}
.task-card.done .bonus-badge{opacity:0.55}
.remove-btn{opacity:0;font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;padding:0 4px;transition:opacity 0.15s;flex-shrink:0}
.task-card:hover .remove-btn{opacity:0.6}
.remove-btn:hover{opacity:1!important}
.task-meta{font-size:10px;color:var(--text-faint);padding:0 13px 8px 45px;font-style:italic;display:none}
.task-card.done .task-meta{display:block}

.task-note-btn{opacity:0.55;font-size:11px;color:var(--text-dim);background:none;border:1px solid var(--border);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;transition:all 0.15s;line-height:1}
.task-note-btn:hover{opacity:1;border-color:var(--gold);color:var(--gold)}
.task-card.show-note .task-note-btn{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);opacity:1}
.task-note{padding:8px 13px 11px 45px;color:var(--text-dim);font-size:12px;line-height:1.45;font-style:italic;border-top:1px dashed var(--border);display:none;background:rgba(0,0,0,0.15)}
.task-card.show-note .task-note{display:block}

.add-task-row{display:flex;gap:6px;margin-top:6px;margin-bottom:12px}
.add-task-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Crimson Text',Georgia,serif;font-size:13px;outline:none}
.add-task-input:focus{border-color:var(--border-hi)}
.add-task-input::placeholder{color:var(--text-faint)}
.add-task-btn{background:var(--gold-dim);border:1px solid rgba(200,168,74,0.25);color:var(--gold);border-radius:8px;padding:9px 14px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.1em;cursor:pointer;white-space:nowrap;transition:all 0.2s}
.add-task-btn:hover{background:rgba(200,168,74,0.2)}

.notes-area{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:8px}
.notes-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.notes-input{width:100%;background:transparent;border:none;color:var(--text);font-family:'Crimson Text',Georgia,serif;font-size:13px;line-height:1.5;resize:vertical;min-height:60px;outline:none}
.notes-input::placeholder{color:var(--text-faint)}

.alert-card{background:var(--red-soft);border:1px solid rgba(192,57,43,0.35);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.alert-title{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#e74c3c;margin-bottom:8px}

.cmd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:480px){.cmd-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.cmd-grid{grid-template-columns:repeat(5,1fr)}}
.cmd-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform 0.15s,border-color 0.15s}
.cmd-card:hover{transform:translateY(-2px);border-color:var(--border-hi)}
.cmd-hd{padding:9px 11px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:white}
.cmd-bd{padding:10px 11px}
.cmd-bar{height:3px;border-radius:2px;background:rgba(255,255,255,0.08);margin-bottom:7px;overflow:hidden}
.cmd-fill{height:100%;border-radius:2px;transition:width 0.4s}
.cmd-pct{font-family:'Cinzel',serif;font-size:17px;font-weight:700}
.cmd-sub{font-size:10px;color:var(--text-dim);margin-top:1px}
.cmd-flag{font-size:10px;margin-top:3px}

.gold-div{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0;opacity:0.25}
.slip-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:5px;font-size:13px}
.empty-msg{text-align:center;color:var(--text-faint);font-style:italic;font-size:13px;padding:18px}
.reset-btn{background:var(--red-soft);border:1px solid rgba(192,57,43,0.25);color:#e74c3c;border-radius:8px;padding:9px 16px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
.reset-btn:hover{background:rgba(192,57,43,0.2)}
.start-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold-dim);border:1px solid rgba(200,168,74,0.2);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--gold);font-style:italic;margin-bottom:14px}

/* Hard Day mode */
.hd-toggle{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border-hi);color:var(--text-dim);padding:6px 13px;border-radius:16px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;margin-top:12px}
.hd-toggle:hover{border-color:var(--gold);color:var(--gold)}
.hd-toggle.on{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
.hd-banner{background:linear-gradient(135deg,var(--gold-dim),transparent);border:1px solid rgba(200,168,74,0.3);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.hd-banner-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.hd-banner-sub{font-size:12px;color:var(--text-dim);font-style:italic}
.hd-exit{color:var(--gold);background:none;border:none;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;padding:0;margin-top:5px;text-decoration:underline;text-decoration-color:rgba(200,168,74,0.3)}
.hd-exit:hover{text-decoration-color:var(--gold)}

/* Rollover banner */
.rollover-bar{background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:8px;padding:11px 13px;margin-bottom:14px}
.rollover-bar-title{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#e74c3c;margin-bottom:4px}
.rollover-bar-list{font-size:12px;color:var(--text-dim);line-height:1.5}
.more-toggle{background:none;border:none;color:var(--text-dim);font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.08em;cursor:pointer;text-transform:uppercase;padding:5px 0 0;display:inline-block;text-decoration:underline;text-decoration-color:var(--border-hi)}
.more-toggle:hover{color:var(--text)}

/* Particle overlay (completion FX) */
#fxOverlay{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;transform:translate(-50%,-50%);will-change:transform,opacity;box-shadow:0 0 8px currentColor}
.particle.fly{animation:particleFly 650ms cubic-bezier(0.2,0.7,0.3,1) forwards}
@keyframes particleFly{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(1)}
  60% {opacity:0.85}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0.2)}
}

/* ===== Global tabs (chores / projects / shopping) ===== */
.global-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.global-title{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--gold);letter-spacing:0.04em}
.global-sub{font-size:12px;color:var(--text-dim);font-style:italic;margin-top:2px}

/* Chores */
.chore-day{margin-bottom:14px}
.chore-day-hd{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.chore-day-hd.today{color:var(--gold)}
.chore-day-hd.today::after{content:'· today';color:var(--text-faint);font-size:9px;letter-spacing:0.1em;font-weight:400;text-transform:lowercase}
.chore-item{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px;padding:10px 12px;transition:border-color 0.15s,opacity 0.2s;flex-wrap:wrap}
.chore-item.done{opacity:0.5}
.chore-item.done .chore-text{text-decoration:line-through;color:var(--text-dim)}
.chore-text{flex:1;font-size:13px;min-width:120px}
.chore-asg{display:flex;gap:3px;flex-shrink:0;flex-wrap:wrap}
.chore-asg-pill{font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;border-radius:8px;color:white;white-space:nowrap}
.chore-actions{display:flex;gap:4px;flex-shrink:0}
.chore-edit-btn{opacity:0.4;font-size:12px;color:var(--text-dim);background:none;border:none;cursor:pointer;padding:2px 4px;transition:all 0.15s;flex-shrink:0;line-height:1}
.chore-item:hover .chore-edit-btn{opacity:0.7}
.chore-edit-btn:hover{opacity:1!important;color:var(--gold)}
.chore-edit-btn.del:hover{color:var(--red)}
.chore-week-row{display:flex;gap:3px;flex-shrink:0}
.chore-day-cell{width:26px;height:26px;border-radius:5px;border:1px solid var(--border-hi);background:transparent;color:var(--text-dim);font-family:'Cinzel',serif;font-size:9px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.chore-day-cell.today{border-color:var(--gold);color:var(--gold)}
.chore-day-cell.done{background:var(--success);border-color:var(--success);color:white}
.chore-day-cell:hover{border-color:var(--text)}

/* Projects */
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.proj-card.paused{opacity:0.6}
.proj-card.done{opacity:0.7}
.proj-hd{padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.proj-name{flex:1;font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:0.02em;color:var(--text)}
.proj-pct{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);font-weight:700;flex-shrink:0}
.proj-status-pill{font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.1em;text-transform:uppercase;padding:2px 7px;border-radius:8px;border:1px solid var(--border);color:var(--text-dim);background:transparent;cursor:pointer;flex-shrink:0}
.proj-status-pill.active{color:var(--success);border-color:rgba(39,174,96,0.4);background:rgba(39,174,96,0.08)}
.proj-status-pill.paused{color:var(--text-dim);border-color:var(--border-hi)}
.proj-status-pill.done{color:var(--gold);border-color:rgba(200,168,74,0.4);background:var(--gold-dim)}
.proj-bar{height:3px;background:rgba(255,255,255,0.05);overflow:hidden}
.proj-fill{height:100%;background:var(--gold);transition:width 0.4s}
.proj-body{padding:11px 13px;border-top:1px solid var(--border);display:none}
.proj-card.open .proj-body{display:block}
.proj-task{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;cursor:pointer}
.proj-task:last-child{border-bottom:none}
.proj-task .task-check{width:18px;height:18px}
.proj-task.done .proj-task-text{text-decoration:line-through;color:var(--text-dim)}
.proj-task-text{flex:1}
.proj-task-asg{display:flex;gap:3px;flex-shrink:0}
.proj-rm-btn{opacity:0.3;background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;padding:0 4px}
.proj-task:hover .proj-rm-btn{opacity:0.7}
.proj-rm-btn:hover{opacity:1!important}
.proj-actions-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}

/* Shopping */
.shop-cat{margin-bottom:16px}
.shop-cat-hd{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.shop-cat-count{font-size:10px;color:var(--text-faint);margin-left:auto}

function weekDates(){
  const arr = [];
  const m = new Date();
  m.setDate(m.getDate() - ((m.getDay()+6)%7)); // back to Monday
  m.setHours(0,0,0,0);
  for(let i=0; i<7; i++){
    const d = new Date(m); d.setDate(m.getDate()+i);
    arr.push(dk(d));
  }
  return arr;
}

  weekDates().forEach(d => {
    const checks = state[pid]?.today?.[d] || {};
    daily.forEach(t => { if(checks[t.id]) done++; });
  });
  const pct = done / total;
  return {done, total, pct, earned: Math.round(pct * WEEK_CAP * 100) / 100};
}

// === Bonus earnings (per-task $ amounts) ===
// Stored at earnings/{pid}/bonus/{weekKey} as {[bonusKey]: amount}.
// Awarded on check, rescinded on uncheck. Amount captured at check time.
const bonusData = {};  // {[pid]: {[weekKey]: {[bonusKey]: amount}}}
const fsBonus = (pid, wk) => `earnings/${pid}/bonus/${wk}`;
const bonusKeyPersonal = (sc, dateKey, tid) => `${sc}__${dateKey}__${tid}`;
const bonusKeyProject  = (projId, tid) => `proj__${projId}__${tid}`;

function weekBonus(pid){
  if(!EARNERS.includes(pid)) return 0;
  const m = bonusData[pid]?.[weekK()] || {};
  let sum = 0;
  for(const v of Object.values(m)){ if(typeof v === 'number') sum += v; }
  return Math.round(sum * 100) / 100;
}

async function awardBonus(pid, key, amount){
  if(!EARNERS.includes(pid)) return;
  const amt = Number(amount);
  if(!isFinite(amt) || amt <= 0) return;
  const wk = weekK();
  bonusData[pid] = bonusData[pid] || {};
  bonusData[pid][wk] = bonusData[pid][wk] || {};
  bonusData[pid][wk][key] = Math.round(amt * 100) / 100;
  try{ await setDoc(doc(db, fsBonus(pid, wk)), bonusData[pid][wk]); }
  catch(e){ console.error('award bonus', e); }
}

async function rescindBonus(pid, key){
  if(!EARNERS.includes(pid)) return;
  const wk = weekK();
  if(!bonusData[pid]?.[wk] || !(key in bonusData[pid][wk])) return;
  delete bonusData[pid][wk][key];
  try{ await setDoc(doc(db, fsBonus(pid, wk)), bonusData[pid][wk]); }
  catch(e){ console.error('rescind bonus', e); }
}

// Find a task definition by id across canonical + custom for a (pid, sc).
function findTaskByIdFull(pid, sc, tid){
  if(sc === 'today'){
    for(const g of (PEOPLE[pid]?.today || [])){
      const t = (g.tasks || []).find(t => t.id === tid);
      if(t) return t;
    }
  } else {
    const t = (PEOPLE[pid]?.[sc] || []).find(t => t.id === tid);
    if(t) return t;
  }
  return (custom[pid]?.[sc] || []).find(t => t.id === tid) || null;
}

function recentChecks(p, sc, limit=6){
  const k = scopeKey(sc), m = state[p]?.[sc]?.[k]||{};
  const arr = [];
  for(const [tid, v] of Object.entries(m)){
    if(v && typeof v === 'object' && v.at) arr.push({tid, at:v.at, by:v.by||null});
  }
  arr.sort((a,b)=>b.at - a.at);
  return arr.slice(0, limit);
}
function findTaskText(p, sc, tid){

    ? [...PEOPLE[p].today.flatMap(g=>g.tasks), ...(custom[p]?.today||[])]

function personStats(p){

// === Desktop browser notifications (step 15) ===
const _firstSnap = {};  // path -> true once initial snapshot recorded
const _seenChecks = {}; // pid.sc.tid -> at  (timestamps we've already surfaced)
let _notifReady = false;

function setupNotifications(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'granted'){ _notifReady = true; return; }
  if(Notification.permission === 'denied') return;
  // Browsers require a user gesture for the prompt — attach to first click
  const ask = async () => {
    document.removeEventListener('click', ask, true);
    try{
      const res = await Notification.requestPermission();
      if(res === 'granted') _notifReady = true;
    }catch(e){}
  };
  document.addEventListener('click', ask, true);
}

function notify(title, body){
  if(!_notifReady) return;
  try {
    const n = new Notification(title, {body, tag: 'guildhall', silent: false});
    setTimeout(() => n.close(), 6000);
    n.onclick = () => { window.focus(); n.close(); };
  } catch(e){}
}

function diffChecksAndNotify(pid, sc, key, newData){
  const path = `${pid}.${sc}.${key}`;
  if(!_firstSnap[path]){
    // First time we see this doc — record baseline without notifying
    _firstSnap[path] = true;
    for(const [tid, v] of Object.entries(newData||{})){
      if(v && typeof v === 'object' && v.at){
        (_seenChecks[pid] = _seenChecks[pid] || {});
        (_seenChecks[pid][sc] = _seenChecks[pid][sc] || {});
        _seenChecks[pid][sc][tid] = v.at;
      }
    }
    return;
  }
  // Only care about today's check changes for notifications
  if(sc !== 'today' || key !== todayK()) return;
  for(const [tid, v] of Object.entries(newData||{})){
    if(!v || typeof v !== 'object' || !v.at) continue;
    const seen = _seenChecks[pid]?.[sc]?.[tid];
    if(seen && seen >= v.at) continue;
    (_seenChecks[pid] = _seenChecks[pid] || {});
    (_seenChecks[pid][sc] = _seenChecks[pid][sc] || {});
    _seenChecks[pid][sc][tid] = v.at;
    // Skip if same actor as current viewer (likely "you")
    if(v.by && v.by === currentActor()) continue;
    const actorName = v.by && PEOPLE_META[v.by] ? PEOPLE_META[v.by].name : 'someone';
    const ownerName = PEOPLE_META[pid]?.name || pid;
    const txt = findTaskText(pid, sc, tid);
    const critical = isRollover(tid);
    const subject = (v.by === pid)
      ? `${ownerName} checked off`
      : `${actorName} checked off for ${ownerName}`;
    notify(critical ? `⚑ ${subject}` : subject, txt);
  }
}

// === Particles (step 3) ===
function spawnParticles(x, y, color){
  const overlay = document.getElementById('fxOverlay');
  if(!overlay) return;
  const colors = [color, '#c8a84a', color, '#c8a84a', '#e8e0d0'];
  const N = 16;
  for(let i=0; i<N; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI*2*i)/N + (Math.random()-0.5)*0.35;
    const dist = 38 + Math.random()*32;
    p.style.left = x+'px'; p.style.top = y+'px';
    p.style.background = colors[i % colors.length];
    p.style.color = colors[i % colors.length];
    p.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    p.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    overlay.appendChild(p);
    requestAnimationFrame(()=>p.classList.add('fly'));
    setTimeout(()=>p.remove(), 720);
  }
}

async function toggleTask(p, sc, tid){
  const k = scopeKey(sc); ensure(p,sc,k);

  const wasChecked = !!cur;
  if(wasChecked){
    delete state[p][sc][k][tid];
  } else {
    state[p][sc][k][tid] = { at: Date.now(), by: currentActor() };
  }
  syncSt('syncing');
  try{ await setDoc(doc(db,fsCheck(p,sc,k)), state[p][sc][k]); syncSt('synced'); }
  catch(e){ console.error(e); syncSt('error'); }
  // Bonus: credit OWNER of the task (the pid whose tab it lives on) if earner
  // and the task carries a $ amount. Captures amount at check time.
  if(EARNERS.includes(p)){
    const task = findTaskByIdFull(p, sc, tid);
    const amt = Number(task?.bonus);
    if(task && isFinite(amt) && amt > 0){
      const key = bonusKeyPersonal(sc, k, tid);
      if(wasChecked) await rescindBonus(p, key);
      else           await awardBonus(p, key, amt);
    }
  }
  refreshView();
}

function applyBonusPatch(t, patch){
  if(!('bonus' in patch)) return;
  const v = patch.bonus;
  if(v === '' || v == null) { delete t.bonus; return; }
  const n = Number(v);
  if(isFinite(n) && n > 0) t.bonus = Math.round(n * 100) / 100;
  else delete t.bonus;
}
async function editTaskDef(pid, sc, tid, patch){
  if(!TASK_DEFS?.[pid]) return;
  const defs = TASK_DEFS[pid];
  if(sc === 'today'){
    for(const g of (defs.today||[])){
      const t = (g.tasks||[]).find(t => t.id === tid);
      if(t){
        if('text' in patch) t.text = patch.text;
        if('rollover' in patch){
          if(patch.rollover) t.rollover = true; else delete t.rollover;
        }
        if('note' in patch){
          if(patch.note && patch.note.trim()) t.note = patch.note.trim(); else delete t.note;
        }
        applyBonusPatch(t, patch);
        break;
      }
    }
  } else {
    const t = (defs[sc]||[]).find(t => t.id === tid);
    if(t){
      if('text' in patch) t.text = patch.text;
      if('day'  in patch){ if(patch.day) t.day = patch.day; else delete t.day; }
      if('note' in patch){ if(patch.note && patch.note.trim()) t.note = patch.note.trim(); else delete t.note; }
      applyBonusPatch(t, patch);
    }
  }
  await persistTaskDefs();
}
async function deleteTaskDef(pid, sc, tid){
  if(!confirm('Delete this task permanently from the defaults?')) return;
  if(!TASK_DEFS?.[pid]) return;
  const defs = TASK_DEFS[pid];
  if(sc === 'today'){
    (defs.today||[]).forEach(g => { g.tasks = (g.tasks||[]).filter(t => t.id !== tid); });
  } else {
    defs[sc] = (defs[sc]||[]).filter(t => t.id !== tid);
  }
  await persistTaskDefs();
}
async function addTaskDef(pid, sc, opts){
  if(!opts?.text?.trim() || !TASK_DEFS?.[pid]) return;
  const defs = TASK_DEFS[pid];
  const id = pid.slice(0,2) + '_' + (sc==='today'?'d':sc[0]) + '_' + Date.now();
  const newTask = {id, text: opts.text.trim()};
  if(opts.rollover) newTask.rollover = true;
  if(opts.note && opts.note.trim()) newTask.note = opts.note.trim();
  if(opts.bonus != null && opts.bonus !== ''){
    const n = Number(opts.bonus);
    if(isFinite(n) && n > 0) newTask.bonus = Math.round(n * 100) / 100;
  }
  if(sc === 'today'){
    const groupName = opts.group || (defs.today[0]?.group || 'Daily');
    let g = (defs.today||[]).find(g => g.group === groupName);
    if(!g){ g = {group: groupName, tasks: []}; defs.today = defs.today || []; defs.today.push(g); }
    g.tasks = g.tasks || [];
    g.tasks.push(newTask);
  } else {
    if(opts.day) newTask.day = opts.day;
    defs[sc] = defs[sc] || [];
    defs[sc].push(newTask);
  }
  await persistTaskDefs();
}
async function addGroupToToday(pid, groupName, alert){

  if((TASK_DEFS[pid].today||[]).some(g => g.group === groupName)) { alert && alert('Group name already exists.'); return; }
  TASK_DEFS[pid].today = TASK_DEFS[pid].today || [];

let _checksSubscribed = false;
function subscribeAll(){
  const pairs=[{sc:'today',k:todayK()},{sc:'today',k:ydayK()},{sc:'week',k:weekK()},{sc:'month',k:monthK()}];
  Object.keys(PEOPLE).forEach(pid=>{
    pairs.forEach(({sc,k})=>{
      onSnapshot(doc(db,fsCheck(pid,sc,k)),snap=>{
        ensure(pid,sc,k);
        const data = snap.exists()?snap.data():{};
        // step 15 — diff for notifications before overwriting state
        diffChecksAndNotify(pid, sc, k, data);
        state[pid][sc][k] = data;
        syncSt('synced');
        if(window._showApp) window._showApp();
        if(curP===pid||curP==='command') refreshView();
      },e=>{ console.error(e); syncSt('error'); });
    });
    // step 13 — earners need ALL 7 days of this week to compute proportional pay
    if(EARNERS.includes(pid)){
      weekDates().forEach(d => {
        if(d === todayK() || d === ydayK()) return; // already subscribed
        onSnapshot(doc(db,fsCheck(pid,'today',d)), snap => {
          ensure(pid,'today',d);
          state[pid].today[d] = snap.exists() ? snap.data() : {};
          if(curP===pid||curP==='command') refreshView();
        });
      });
      // Bonus earnings doc for this week
      const wk = weekK();
      try {
        onSnapshot(doc(db, fsBonus(pid, wk)), snap => {
          bonusData[pid] = bonusData[pid] || {};
          bonusData[pid][wk] = snap.exists() ? snap.data() : {};
          if(curP===pid||curP==='command') refreshView();
        }, e => console.error('bonus sub', e));
      } catch(e){ console.error('bonus sub register', e); }
    }
    onSnapshot(doc(db,fsNote(pid)),snap=>{ notes[pid]=snap.exists()?(snap.data().text||''):''; if(curP===pid||curP==='command') refreshView(); });
    ['today','week','month'].forEach(sc=>{
      onSnapshot(doc(db,fsCustom(pid,sc)),snap=>{
        if(!custom[pid]) custom[pid]={};
        custom[pid][sc]=snap.exists()?(snap.data().tasks||[]):[];
        if(curP===pid||curP==='command') refreshView();
      });
    });
    onSnapshot(doc(db,fsHard(pid)),snap=>{
      const d = snap.exists() ? snap.data().date : null;
      hardDay[pid] = (d === todayK());
      if(curP===pid||curP==='command') refreshView();
    });
  });
  subscribeGlobals();
}

// Each subscription wrapped in its own try so a single bad path/permission
// error can't prevent the others from registering. Verbose seed logging so
// problems are easy to spot in DevTools.
function subscribeGlobals(){
  let _globalsBooted = false;
  if(_globalsBooted) return; _globalsBooted = true;

  function safeSub(label, pathFn, onData, seedFn){
    try {
      const ref = doc(db, pathFn());
      onSnapshot(ref, async snap => {
        if(!snap.exists()){
          if(seedFn){
            console.log(`[seed] ${label} doc missing — seeding defaults…`);
            try{
              await setDoc(ref, seedFn());
              console.log(`[seed] ${label} seeded OK.`);
            }catch(e){
              console.error(`[seed] ${label} write FAILED:`, e);
            }
          }
          return;
        }
        try { onData(snap); } catch(e){ console.error(`[sub] ${label} handler error:`, e); }
      }, e => console.error(`[sub] ${label} snapshot error:`, e));
      console.log(`[sub] ${label} listener registered at ${pathFn()}`);
    } catch(e){
      console.error(`[sub] ${label} REGISTRATION failed (likely bad path):`, e);
    }
  }

  safeSub('chores',     fsChores,                  snap => { chores   = {chores:  snap.data().chores  || []}; refreshView(); }, () => ({chores: DEFAULT_CHORES}));
  safeSub('choreChecks',() => fsChoreCk(weekK()),  snap => { choreChecks[weekK()] = snap.data(); refreshView(); }, null);
  safeSub('projects',   fsProjects,                snap => { projects = {projects: snap.data().projects || []}; refreshView(); }, () => ({projects: []}));
  safeSub('shopping',   fsShopping,                snap => { shopping = {items:    snap.data().items   || []}; refreshView(); }, () => ({items: []}));
}

// === Subscribe to config/taskDefs; seed defaults on first run if missing ===
function subscribeTaskDefs(){
  onSnapshot(doc(db,'config/taskDefs'), async snap => {
    if(!snap.exists()){
      try{
        syncSt('syncing');
        await setDoc(doc(db,'config/taskDefs'), DEFAULT_TASK_DEFS);
      }catch(e){ console.error('Seed taskDefs failed', e); syncSt('error'); }
      return;
    }
    TASK_DEFS = snap.data();
    rebuildPEOPLE();
    if(!_checksSubscribed){ _checksSubscribed = true; subscribeAll(); }
    if(window._showApp) window._showApp();
    refreshView();
  }, e => { console.error('taskDefs subscribe error', e); syncSt('error'); });
}

// === RENDER HELPERS ===
function escAttr(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escHtml(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts), h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  const hr = ((h+11)%12)+1; return `${hr}:${m}${h<12?'a':'p'}`;
}

function taskCard(p, sc, task, rolls, canRemove, editable){
  // In edit mode, if this task is the one being edited, render inline form instead.
  if(editable && _editing && _editing.kind === 'taskDef'
     && _editing.pid === p && _editing.sc === sc && _editing.tid === task.id){
    return taskEditForm(p, sc, task);
  }
  const chk = getChecked(p,sc), checkedVal = chk[task.id], done = !!checkedVal;
  const roll = rolls.has(task.id);
  const px = PEOPLE[p];
  const chkSt = done
    ? `background:${px.color};border-color:${px.color};box-shadow:0 0 6px ${px.glow}`
    : roll ? `border-color:#e74c3c;box-shadow:0 0 4px rgba(231,76,60,0.3)` : '';
  const bdr  = roll && !done ? 'border-color:rgba(231,76,60,0.3)' : '';
  const badge = roll && !done ? `<span class="rollover-badge">missed yesterday</span>` : '';
  const noteText = task.note ? escHtml(task.note) : '';
  const noteBtn = noteText
    ? `<button class="task-note-btn" onclick="event.stopPropagation();window._togNote(this)" title="Show context">i</button>` : '';
  const noteBlock = noteText ? `<div class="task-note">${noteText}</div>` : '';
  const rmBtn = canRemove
    ? `<button class="remove-btn" onclick="event.stopPropagation();window._rm('${p}','${sc}','${task.id}')" title="Remove">✕</button>` : '';
  const editBtns = editable ? `
      <button class="chore-edit-btn" onclick="event.stopPropagation();window._editTask('${p}','${sc}','${task.id}')" title="Edit task">⋯</button>
      <button class="chore-edit-btn del" onclick="event.stopPropagation();window._delTask('${p}','${sc}','${task.id}')" title="Delete task">✕</button>` : '';
  let meta = '';
  if(done && typeof checkedVal === 'object'){
    const by = checkedVal.by && PEOPLE_META[checkedVal.by] ? PEOPLE_META[checkedVal.by].name : (checkedVal.by||'');
    const at = fmtTime(checkedVal.at);
    if(by || at) meta = `<div class="task-meta">${by?'by '+escHtml(by):''}${by&&at?' · ':''}${at?escHtml(at):''}</div>`;
  }
  const editBadge = editable && task.rollover ? `<span class="rollover-badge" style="background:rgba(200,168,74,0.1);border-color:rgba(200,168,74,0.3);color:var(--gold)">critical</span>` : '';
  const bonusBadge = (EARNERS.includes(p) && Number(task.bonus) > 0)
    ? `<span class="bonus-badge">+$${Number(task.bonus).toFixed(2)}</span>`
    : '';
  return `<div class="task-card${done?' done':''}" style="${bdr}" onclick="window._tog('${p}','${sc}','${task.id}',event)">
    <div class="task-inner">
      <div class="task-check" style="${chkSt}">${done?'✓':''}</div>
      <div class="task-text">${escHtml(task.text)}</div>
      ${bonusBadge}${badge}${editBadge}${noteBtn}${rmBtn}${editBtns}
    </div>
    ${noteBlock}${meta}
  </div>`;
}

    .map(t => t.text.split('—')[0].trim());
  const head = items.slice(0,3), rest = items.slice(3);
  let html = `<div class="rollover-bar">
    <div class="rollover-bar-title">⚠ ${rolls.size} rolled over from yesterday</div>
    <div class="rollover-bar-list">${escHtml(head.join(', '))}`;
  if(rest.length){
    const restId = `rovMore_${p}`;
    html += `<div id="${restId}" style="display:none;margin-top:4px">${escHtml(rest.join(', '))}</div>
      <button class="more-toggle" data-rid="${restId}" data-more="+${rest.length} more" data-less="hide ${rest.length}" onclick="window._togMore(this)">+${rest.length} more</button>`;

function renderPerson(p){
  const px = PEOPLE[p], st = personStats(p), rolls = getRollovers(p), started = isStarted();
  const hd = !!hardDay[p];
  const nowGrp = timeGroupNow();

  let hero = `<div class="person-hero" style="background:linear-gradient(135deg,${px.soft},transparent);border-color:${px.glow}">
    <div class="hero-name" style="color:${px.color}">${px.name}</div>
    <div class="hero-role">${px.role}</div>
    <div class="hero-stats">
      <div class="stat-box"><div class="stat-val" style="color:${px.color}">${st.tDone}</div><div class="stat-lbl">Done Today</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${px.color}">${st.tTotal-st.tDone}</div><div class="stat-lbl">Remaining</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${rolls.size>0?'#e74c3c':px.color}">${rolls.size}</div><div class="stat-lbl">Rolled Over</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${px.color}">${st.pct}%</div><div class="stat-lbl">Week</div></div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">
      <button class="hd-toggle${hd?' on':''}" style="margin-top:0" onclick="window._hd('${p}')">${hd?'✓ Hard Day · essentials only':'Hard Day — essentials only'}</button>
      <button class="hd-toggle${_editMode?' on':''}" style="margin-top:0" onclick="window._toggleEditMode()">${_editMode?'✓ Editing tasks':'Edit tasks'}</button>
    </div>
  </div>${renderEarningsBar(p)}`;

  if(!started){
    hero += `<div class="start-badge">⏳ System starts ${fmtStart()} — no missed indicators yet</div>`;
  } else {
    hero += renderRolloverBanner(p, rolls);
  }

  let T = hero;
  if(hd){
    T += `<div class="hd-banner">
      <div class="hd-banner-title">Hard Day — Essentials Only</div>
      <div class="hd-banner-sub">Showing critical tasks. Everything else can wait. This is permission, not punishment.</div>
      <button class="hd-exit" onclick="window._hd('${p}')">exit hard day</button>
    </div>`;
  }

  px.today.forEach(g=>{
    const tasks = hd ? (g.tasks||[]).filter(t => t.rollover) : (g.tasks||[]);
    // In edit mode, show group even if empty so user can add to it
    if(!tasks.length && !_editMode) return;
    const tg = groupKey(g.group);
    let stateCls = '';
    if(tg && TIME_ORDER[tg] && tasks.length){
      if(tg === nowGrp) stateCls = 'now';
      else if(TIME_ORDER[tg] < TIME_ORDER[nowGrp]){
        const grpDone = tasks.every(t => getChecked(p,'today')[t.id]);
        if(grpDone) stateCls = 'dim';
      }
    }
    // Group header (with manage controls in edit mode)
    if(g.alert){
      T += `<div class="alert-card"><div class="alert-title">${escHtml(g.group)}${_editMode?renderGroupBtns(p,g):''}</div>`;
      tasks.forEach(t => T += taskCard(p,'today',t,rolls,false,_editMode));
      if(_editMode) T += renderAddTaskBtnOrForm(p,'today',g.group);
      T += `</div>`;
    } else {
      T += `<div class="sec-head${stateCls?' '+stateCls:''}"><div class="sec-lbl">${escHtml(g.group)}</div><div class="sec-line"></div>${_editMode?renderGroupBtns(p,g):''}</div>`;
      tasks.forEach(t => T += taskCard(p,'today',t,rolls,false,_editMode));
      if(_editMode) T += renderAddTaskBtnOrForm(p,'today',g.group);
    }
  });
  if(_editMode){
    T += `<button class="edit-show-btn" onclick="window._addGroup('${p}')">+ Add new group</button>`;
  }
  const ct = getCustom(p,'today');
  if(ct.length){ T += secH('My Added Tasks'); ct.forEach(t => T += taskCard(p,'today',t,rolls,true,false)); }
  T += addRow(p,'today');
  T += `${secH('Notes for Tina + Mark')}<div class="notes-area"><textarea class="notes-input" placeholder="Anything to flag? Tap to type..." oninput="window._note('${p}',this.value)">${escHtml(getNote(p))}</textarea></div>`;

  const wt = allScopeTasks(p,'week'), wd = wt.filter(t => getChecked(p,'week')[t.id]).length;
  let W = secH('This Week\'s Tasks',`${wd}/${wt.length}`);
  px.week.forEach(t => W += taskCard(p,'week',t,new Set(),false,_editMode));
  if(_editMode) W += renderAddTaskBtnOrForm(p,'week',null);
  const cw = getCustom(p,'week');
  if(cw.length){ W += secH('My Added Tasks'); cw.forEach(t => W += taskCard(p,'week',t,new Set(),true,false)); }
  W += addRow(p,'week');

  const mt = allScopeTasks(p,'month'), md = mt.filter(t => getChecked(p,'month')[t.id]).length;
  let M = secH('This Month\'s Tasks',`${md}/${mt.length}`);
  px.month.forEach(t => M += taskCard(p,'month',t,new Set(),false,_editMode));
  if(_editMode) M += renderAddTaskBtnOrForm(p,'month',null);
  const cm = getCustom(p,'month');
  if(cm.length){ M += secH('My Added Tasks'); cm.forEach(t => M += taskCard(p,'month',t,new Set(),true,false)); }
  M += addRow(p,'month');

  return {T,W,M};
}

function renderCommand(){
  const pids=Object.keys(PEOPLE), started=isStarted();
  let T=`<div style="font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--gold);margin-bottom:4px">⚔ Command Center</div>

  if(!started) T+=`<div class="start-badge" style="margin-bottom:14px">⏳ System officially starts ${fmtStart()}</div>`;

  T+=`<div class="cmd-grid">`;
  pids.forEach(pid=>{
    const px=PEOPLE[pid],st=personStats(pid),rolls=getRollovers(pid);
    const missed=getMissedYday(pid).filter(t=>!isRollover(t.id));
    const hasNote=!!getNote(pid).trim();
    const hd = !!hardDay[pid];
    T+=`<div class="cmd-card" onclick="window._goto('${pid}')">
      <div class="cmd-hd" style="background:${px.color}">${px.name}</div>
      <div class="cmd-bd">
        <div class="cmd-bar"><div class="cmd-fill" style="width:${st.pct}%;background:${px.color}"></div></div>
        <div class="cmd-pct" style="color:${px.color}">${st.pct}%</div>
        <div class="cmd-sub">${st.tDone}/${st.tTotal} today</div>
        ${started&&rolls.size>0?`<div class="cmd-flag" style="color:#e74c3c">⚠ ${rolls.size} rolled over</div>`:''}
        ${started&&missed.length>0?`<div class="cmd-flag" style="color:var(--text-faint)">○ ${missed.length} missed yday</div>`:''}
        ${hasNote?`<div class="cmd-flag" style="color:var(--gold)">📝 note</div>`:''}
        ${hd?`<div class="cmd-flag" style="color:var(--gold)">⚑ Hard Day</div>`:''}
      </div></div>`;
  });
  T+=`</div><div class="gold-div"></div>`;

  if(started){
    T+=secH('Missed Yesterday — Detail');
    T+=`<div style="font-size:11px;color:var(--text-faint);margin-bottom:8px;font-style:italic">Rolled-over items show on each person's own list. Everything else visible here only.</div>`;
    let any=false;
    pids.forEach(pid=>{
      const m=getMissedYday(pid); if(!m.length) return; any=true;
      const px=PEOPLE[pid];
      const cr=m.filter(t=>isRollover(t.id)), ot=m.filter(t=>!isRollover(t.id));
      T+=`<div class="slip-item"><strong style="color:${px.color}">${px.name}</strong>
        ${cr.length?`<div style="margin-top:4px;font-size:12px;color:#e74c3c">Critical (rolled over): ${escHtml(cr.map(t=>t.text.split('—')[0].trim()).join(' · '))}</div>`:''}
        ${ot.length?`<div style="margin-top:3px;font-size:12px;color:var(--text-dim)">Other missed: ${escHtml(ot.map(t=>t.text.split('—')[0].trim()).join(' · '))}</div>`:''}
      </div>`;
    });
    if(!any) T+=`<div class="empty-msg">Nothing missed yesterday 🏆</div>`;
    T+=`<div class="gold-div"></div>`;
  }

  T += secH('Recent Activity — Today');
  const allRecent = [];
  pids.forEach(pid => {
    recentChecks(pid,'today',10).forEach(r => allRecent.push({pid, ...r}));
  });
  allRecent.sort((a,b) => b.at - a.at);
  const slice = allRecent.slice(0, 8);
  if(slice.length){
    slice.forEach(r => {
      const px = PEOPLE[r.pid], byName = r.by && PEOPLE_META[r.by] ? PEOPLE_META[r.by].name : (r.by||'');
      const txt = findTaskText(r.pid,'today',r.tid);
      const sameActor = r.by === r.pid;
      const byStr = byName ? (sameActor ? '' : ` <span style="color:var(--text-faint)">via ${escHtml(byName)}</span>`) : '';
      T += `<div class="slip-item">
        <span style="font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.08em;color:var(--text-faint)">${fmtTime(r.at)}</span>
        <strong style="color:${px.color};margin-left:8px">${px.name}</strong>${byStr}
        <div style="margin-top:3px;color:var(--text-dim);font-size:12px">${escHtml(txt)}</div>
      </div>`;
    });
  } else {
    T += `<div class="empty-msg">No completions logged yet today.</div>`;
  }
  T += `<div class="gold-div"></div>`;

  // === Weekly Chores summary (step 10) ===
  T += secH('Weekly Chores — Today');
  const td = todayDayKey();
  const wk = weekK();
  const ck = choreChecks[wk] || {};
  if(chores && chores.chores && chores.chores.length){
    const todays = chores.chores.filter(c => c.day === 'daily' || c.day === td);
    if(todays.length){
      todays.forEach(c => {
        const done = !!(ck[c.id] && ck[c.id][td]);
        const asg = (c.assignees||[]).map(p => PEOPLE_META[p]?.name).filter(Boolean).join(' · ');
        T += `<div class="slip-item" style="cursor:pointer" onclick="window._goto('chores')">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="color:${done?'var(--success)':'var(--text-faint)'};font-size:14px;width:14px">${done?'✓':'○'}</span>
            <strong style="flex:1">${escHtml(c.text)}</strong>
            ${c.day==='daily'?'<span style="font-family:\'Cinzel\',serif;font-size:8px;letter-spacing:0.1em;color:var(--text-faint)">DAILY</span>':''}
          </div>
          ${asg?`<div style="margin-top:3px;font-size:11px;color:var(--text-dim)">${escHtml(asg)}</div>`:''}
        </div>`;
      });
    } else {
      T += `<div class="empty-msg">No chores scheduled for today.</div>`;
    }
    // Week summary count
    const totalSlots = chores.chores.reduce((s,c) => s + (c.day==='daily' ? 7 : 1), 0);
    let doneCount = 0;
    chores.chores.forEach(c => {
      if(c.day === 'daily'){
        const dc = ck[c.id] || {};
        doneCount += DAYS.filter(d => dc[d.key]).length;
      } else if(ck[c.id] && ck[c.id][c.day]) doneCount++;
    });
    const pctWeek = totalSlots ? Math.round(doneCount/totalSlots*100) : 0;
    T += `<div style="text-align:center;font-size:11px;color:var(--text-dim);margin-top:8px;font-family:'Cinzel',serif;letter-spacing:0.08em">This Week: ${doneCount} / ${totalSlots} · ${pctWeek}%</div>`;
  } else if(chores === null){
    T += `<div class="empty-msg">Loading chores…</div>`;
  } else {
    T += `<div class="empty-msg">No chores configured yet.</div>`;
  }
  T += `<div class="gold-div"></div>`;

  // === Projects summary (step 10) ===
  T += secH('Active Projects');
  if(projects && projects.projects && projects.projects.length){
    const active = projects.projects.filter(p => (p.status||'active') === 'active');
    if(active.length){
      active.forEach(p => {
        const ps = projectStats(p);
        const asgSet = new Set();
        (p.tasks||[]).forEach(t => (t.assignees||[]).forEach(a => asgSet.add(a)));
        const asg = [...asgSet].map(pid => PEOPLE_META[pid]?.name).filter(Boolean).join(' · ');
        T += `<div class="slip-item" style="cursor:pointer" onclick="window._goto('projects')">
          <div style="display:flex;align-items:center;gap:8px">
            <strong style="flex:1">${escHtml(p.name)}</strong>
            <span style="font-family:'Cinzel',serif;color:var(--gold);font-size:11px;font-weight:700">${ps.pct}%</span>
          </div>
          <div class="cmd-bar" style="margin-top:6px"><div class="cmd-fill" style="width:${ps.pct}%;background:var(--gold)"></div></div>
          <div style="margin-top:4px;font-size:11px;color:var(--text-dim)">${ps.done}/${ps.total} tasks${asg?' · '+escHtml(asg):''}</div>
        </div>`;
      });
    } else {
      T += `<div class="empty-msg">No active projects.</div>`;
    }
    const paused = projects.projects.filter(p => p.status === 'paused').length;
    const done = projects.projects.filter(p => p.status === 'done').length;
    if(paused || done){
      T += `<div style="text-align:center;font-size:11px;color:var(--text-faint);margin-top:6px;font-family:'Cinzel',serif;letter-spacing:0.08em">${paused?paused+' paused':''}${paused&&done?' · ':''}${done?done+' done':''}</div>`;
    }
  } else if(projects === null){
    T += `<div class="empty-msg">Loading projects…</div>`;
  } else {
    T += `<div class="empty-msg">No projects yet.</div>`;
  }
  T += `<div class="gold-div"></div>`;

  // === Shopping summary (step 10) ===
  T += secH('Shopping');
  if(shopping && shopping.items && shopping.items.length){
    const low = shopping.items.filter(i => i.low);
    T += `<div class="slip-item" style="cursor:pointer" onclick="window._goto('shop')">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <strong>${shopping.items.length} item${shopping.items.length===1?'':'s'} on list</strong>
        ${low.length ? `<span style="color:#e74c3c;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.08em">⚠ ${low.length} RUNNING LOW</span>` : ''}
      </div>
      ${low.length ? `<div style="margin-top:6px;font-size:12px;color:var(--text-dim)">${escHtml(low.slice(0,5).map(i=>i.name).join(' · '))}${low.length>5?` <span style="color:var(--text-faint)">+${low.length-5} more</span>`:''}</div>` : ''}
    </div>`;
  } else if(shopping === null){
    T += `<div class="empty-msg">Loading shopping list…</div>`;
  } else {
    T += `<div class="empty-msg">Shopping list is empty.</div>`;
  }
  T += `<div class="gold-div"></div>`;

  // === Earnings summary (step 13) ===
  T += secH('Weekly Earnings — Connor + Walker');
  T += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">`;
  EARNERS.forEach(pid => {
    const we = weekEarnings(pid);
    const bonus = weekBonus(pid);
    const total = Math.round((we.earned + bonus) * 100) / 100;
    const px = PEOPLE[pid];
    const pct = Math.round(we.pct * 100);
    T += `<div class="slip-item" style="cursor:pointer;background:linear-gradient(135deg,${px.soft},transparent);border-color:${px.glow}" onclick="window._goto('${pid}')">
      <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px">
        <strong style="color:${px.color};flex:1">${px.name}</strong>
        <span style="font-family:'Cinzel',serif;font-size:20px;font-weight:700;color:var(--gold)">$${total.toFixed(2)}</span>
      </div>
      <div class="cmd-bar"><div class="cmd-fill" style="width:${pct}%;background:var(--gold)"></div></div>
      <div style="font-family:'Cinzel',serif;font-size:10px;color:var(--text-dim);margin-top:6px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;letter-spacing:0.04em">
        <span>Base</span><span></span><span style="color:var(--text)">$${we.earned.toFixed(2)} / $${WEEK_CAP.toFixed(2)}</span>
        <span>Bonus</span><span></span><span style="color:var(--text)">$${bonus.toFixed(2)}</span>
        <span style="color:var(--gold)">Total</span><span></span><span style="color:var(--gold);font-weight:700">$${total.toFixed(2)}</span>
      </div>
    </div>`;
  });
  T += `</div><div class="gold-div"></div>`;

  T+=secH('Active Notes from Household');
  let anyN=false;
  pids.forEach(pid=>{ const n=getNote(pid); if(!n.trim()) return; anyN=true; T+=`<div class="slip-item"><strong style="color:${PEOPLE[pid].color}">${PEOPLE[pid].name}</strong><div style="margin-top:4px;color:var(--text-dim)">${escHtml(n)}</div></div>`; });
  if(!anyN) T+=`<div class="empty-msg">No notes today.</div>`;
  T+=`<div class="gold-div"></div>`;

  T+=secH('Minimum Viable — Hard Week Standard');
  T+=`<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;font-style:italic">If these are done, the house is functioning. That is enough.</div>`;
  [{id:'mvs1',text:'All animals have clean water'},{id:'mvs2',text:'Both cat litters scooped 3x today'},{id:'mvs3',text:'Hearth pee pad replaced'},{id:'mvs4',text:'Trash removed'},{id:'mvs5',text:'Dishes washed + dried + put away'},{id:'mvs6',text:'One load of laundry moved'},{id:'mvs7',text:'Main floors swept'},{id:'mvs8',text:'Bathrooms ventilated'}]
    .forEach(t=>T+=taskCard('tina','today',t,new Set(),false));
  T+=`<div class="gold-div"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="reset-btn" onclick="window._rst('today')">Reset Today's Checks</button><button class="reset-btn" onclick="window._rst('week')">Reset This Week</button><div style="font-size:11px;color:var(--text-faint);font-style:italic;margin-top:4px">Daily resets automatically at midnight.</div></div>`;

  let W=secH('Sunday Review Questions');
  [{id:'rv1',text:'What consistently didn\'t happen this week?'},{id:'rv2',text:'Task unclear, or capacity issue?'},{id:'rv3',text:'Anything to reassign or simplify?'},{id:'rv4',text:'What one thing made the biggest difference?'},{id:'rv5',text:'Mold protocol still running? Fan habit holding?'},{id:'rv6',text:'Litter schedule on track?'}]
    .forEach(t=>W+=taskCard('mark','week',t,new Set(),false));

  let M=secH('Monthly Household Tasks');
  [{id:'hmo1',text:'Windows cleaned'},{id:'hmo2',text:'Ceiling fans cleaned'},{id:'hmo3',text:'Baseboards — main areas'},{id:'hmo4',text:'Donation haul completed'},{id:'hmo5',text:'HVAC filter checked (Mark)'},{id:'hmo6',text:'Air purifier filter checked (Mark)'},{id:'hmo7',text:'Pet litter pans cleaned outside (Connor + Walker)'}]
    .forEach(t=>M+=taskCard('tina','month',t,new Set(),false));

  return {T,W,M};
}

function renderChores(){
  let T = `<div class="global-header">
    <div>
      <div class="global-title">Weekly Chores</div>
      <div class="global-sub">Recurring chores by day. Resets each Monday.</div>
    </div>
  </div>`;

  T += `<button class="edit-show-btn" onclick="window._openForm('addChore')">+ Add a chore</button>`;
  T += renderChoreEditForm();

  if(chores === null){
    T += `<div class="empty-msg">Loading chores…</div>`;
    return T;
  }
  if(!chores.chores.length){
    T += `<div class="empty-msg">No chores yet. Add one above.</div>`;
    return T;
  }

  const list = chores.chores;
  const wk = weekK();
  const ck = choreChecks[wk] || {};
  const td = todayDayKey();

  const dailyChores = list.filter(c => c.day === 'daily');
  const byDay = {};
  DAYS.forEach(d => byDay[d.key] = []);
  list.forEach(c => { if(c.day !== 'daily' && byDay[c.day]) byDay[c.day].push(c); });

  if(dailyChores.length){
    T += `<div class="chore-day">
      <div class="chore-day-hd">Daily — every day this week</div>`;
    dailyChores.forEach(c => {
      const dayChecks = ck[c.id] || {};
      T += `<div class="chore-item">
        <div class="chore-text">${escHtml(c.text)}</div>
        ${asgPills(c.assignees)}
        <div class="chore-week-row">${DAYS.map(d => {
          const done = !!dayChecks[d.key], isToday = d.key === td;
          const cls = ['chore-day-cell', done?'done':'', isToday?'today':''].filter(Boolean).join(' ');
          return `<button class="${cls}" onclick="window._togChore('${c.id}','${d.key}')" title="${d.full}">${d.short}</button>`;
        }).join('')}</div>
        <div class="chore-actions">
          <button class="chore-edit-btn" onclick="window._editChore('${c.id}')" title="Edit">⋯</button>
          <button class="chore-edit-btn del" onclick="window._delChore('${c.id}')" title="Delete">✕</button>
        </div>
      </div>`;
    });
    T += `</div>`;
  }

  DAYS.forEach(d => {
    if(!byDay[d.key].length) return;
    const isToday = d.key === td;
    T += `<div class="chore-day">
      <div class="chore-day-hd${isToday?' today':''}">${d.full}</div>`;
    byDay[d.key].forEach(c => {
      const done = !!(ck[c.id] && ck[c.id][d.key]);
      const chkSt = done
        ? `background:var(--success);border-color:var(--success);color:white`
        : `border-color:var(--border-hi)`;
      T += `<div class="chore-item${done?' done':''}" onclick="window._togChore('${c.id}','${d.key}')">
        <div class="task-check" style="${chkSt}">${done?'✓':''}</div>
        <div class="chore-text">${escHtml(c.text)}</div>
        ${asgPills(c.assignees)}
        <div class="chore-actions">
          <button class="chore-edit-btn" onclick="event.stopPropagation();window._editChore('${c.id}')" title="Edit">⋯</button>
          <button class="chore-edit-btn del" onclick="event.stopPropagation();window._delChore('${c.id}')" title="Delete">✕</button>
        </div>
      </div>`;
    });
    T += `</div>`;
  });

  return T;
}

function renderProjects(){

  });

  return T;

function renderShopping(){
  let T = `<div class="global-header">
    <div>
      <div class="global-title">Shopping List</div>
      <div class="global-sub">Shared list — anyone can add. Mark items running low for next run.</div>
    </div>
  </div>`;

  T += `<button class="edit-show-btn" onclick="window._openForm('addShop')">+ Add an item</button>`;
  T += renderShopForm();

  if(shopping === null){
    T += `<div class="empty-msg">Loading shopping list…</div>`;
    return T;
  }
  if(!shopping.items.length){
    T += `<div class="empty-msg">Shopping list is empty.</div>`;
    return T;
  }

  // Group items by category in defined order; uncategorized last.
  const byCat = {};
  SHOP_CATS.forEach(c => byCat[c.key] = []);
  shopping.items.forEach(it => {
    if(byCat[it.category]) byCat[it.category].push(it);
    else { (byCat._misc = byCat._misc || []).push(it); }
  });

  // Low items first within each category
  Object.values(byCat).forEach(arr => arr.sort((a,b) => (b.low?1:0) - (a.low?1:0)));

  // Render: any low items get pulled into a top "Running Low" section for visibility
  const lowAll = shopping.items.filter(i => i.low);
  if(lowAll.length){
    T += `<div class="shop-cat">
      <div class="shop-cat-hd" style="color:#e74c3c">⚠ Running Low<span class="shop-cat-count">${lowAll.length}</span></div>`;
    lowAll.forEach(it => T += renderShopItem(it));
    T += `</div>`;
  }

  SHOP_CATS.forEach(c => {
    const items = byCat[c.key] || [];
    if(!items.length) return;
    T += `<div class="shop-cat">
      <div class="shop-cat-hd">${c.label}<span class="shop-cat-count">${items.length}</span></div>`;
    items.forEach(it => T += renderShopItem(it));
    T += `</div>`;
  });

  const misc = byCat._misc || [];
  if(misc.length){
    T += `<div class="shop-cat">
      <div class="shop-cat-hd">Other<span class="shop-cat-count">${misc.length}</span></div>`;
    misc.forEach(it => T += renderShopItem(it));
    T += `</div>`;
  }

  return T;
}

function renderShopItem(it){
  const byName = it.addedBy && PEOPLE_META[it.addedBy] ? PEOPLE_META[it.addedBy].name : '';
  return `<div class="shop-item${it.low?' low':''}">
    <div class="shop-name">${escHtml(it.name)}</div>
    <input class="shop-qty-input" value="${escAttr(it.qty||'')}" placeholder="qty" onblur="window._setQty('${it.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
    <button class="shop-low-btn${it.low?' on':''}" onclick="window._togLow('${it.id}')">${it.low?'• low':'low?'}</button>
    ${byName ? `<span class="shop-added-by">${escHtml(byName)}</span>` : ''}
    <button class="shop-rm-btn" onclick="window._rmShop('${it.id}')" title="Remove">✕</button>
  </div>`;
}

// === ROUTING ===
let curP='tina', curTab='today';
const PERSON_PIDS = () => Object.keys(PEOPLE_META);
const GLOBAL_TABS = new Set(['chores','projects','shop','command']);

function buildNav(){
  const nav = document.getElementById('personNav');
  const personPills = PERSON_PIDS().map(pid => `<button class="nav-pill${pid===curP?' active':''}" data-p="${pid}" onclick="window._goto('${pid}')">${PEOPLE_META[pid].name}</button>`).join('');
  const globalPills = [
    ['chores',  '⚒ Chores'],
    ['projects','◆ Projects'],
    ['shop',    '🛒 Shop'],
    ['command', '⚔ Command'],
  ].map(([pid,label]) => `<button class="nav-pill${pid===curP?' active':''}" data-p="${pid}" onclick="window._goto('${pid}')">${label}</button>`).join('');
  nav.innerHTML = personPills + '<div class="nav-divider"></div>' + globalPills;
}

window.switchTab=function(tab){
  curTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  renderCurrent();
};

window._goto=function(p){
  // Reset transient editor state when switching contexts
  _formOpen = null; _editing = null; _formScratch = {};
  curP=p; buildNav(); updateTabBarVisibility(); renderCurrent(); window.scrollTo({top:0,behavior:'smooth'});
};

function updateTabBarVisibility(){
  const tw = document.getElementById('tabWrap');
  if(!tw) return;
  tw.classList.toggle('hidden', GLOBAL_TABS.has(curP) && curP !== 'command');
}

function renderCurrent(){
  if(!TASK_DEFS) return;
  let html;
  if(curP === 'chores'){
    html = `<div class="tab-panel active">${renderChores()}</div>`;
  } else if(curP === 'projects'){
    html = `<div class="tab-panel active">${renderProjects()}</div>`;
  } else if(curP === 'shop'){
    html = `<div class="tab-panel active">${renderShopping()}</div>`;
  } else {
    const {T,W,M} = curP==='command' ? renderCommand() : renderPerson(curP);
    html = `
      <div class="tab-panel${curTab==='today'?' active':''}" id="tp_today">${T}</div>
      <div class="tab-panel${curTab==='week'?' active':''}"  id="tp_week">${W}</div>
      <div class="tab-panel${curTab==='month'?' active':''}" id="tp_month">${M}</div>`;
  }
  document.getElementById('mainContent').innerHTML = html;
  updateTitle();
}

// === Live tab title (step 14) ===
function updateTitle(){
  if(!TASK_DEFS){ document.title = 'Guild Hall'; return; }
  let remaining;
  if(curP && PEOPLE_META[curP]){
    const st = personStats(curP);
    remaining = st.tTotal - st.tDone;
    document.title = `Guild Hall · ${remaining} remaining`;
  } else {
    // Global view (Command Center, Chores, Projects, Shop) — sum today across household
    let total = 0, done = 0;
    Object.keys(PEOPLE_META).forEach(pid => {
      const s = personStats(pid);
      total += s.tTotal; done += s.tDone;
    });
    remaining = total - done;
    document.title = `Guild Hall · ${remaining} remaining (household)`;
  }
}

function refreshView(){
  // If an inline edit form has unsaved typed state, capture it before re-render
  // so the user doesn't lose what they typed when another client's snapshot arrives.
  preserveFormState();
  if(document.getElementById('ls').style.display==='none') renderCurrent();
}

// Preserve transient text typed into the open form across re-renders.
// Reads DOM values into module state, then renderChoreEditForm/renderShopForm
// re-emit those values when they next render.
let _formScratch = {};
function preserveFormState(){
  // Chore form
  const ct = document.getElementById('newChoreText');
  if(ct) _formScratch.choreText = ct.value;
  const cd = document.getElementById('newChoreDay');
  if(cd) _formScratch.choreDay = cd.value;
  const ca = document.querySelectorAll('#newChoreAsg .asg-chip.on');
  if(ca) _formScratch.choreAsg = [...ca].map(c => c.dataset.p);
  // Shop form
  const sn = document.getElementById('newShopName');
  if(sn) _formScratch.shopName = sn.value;
  const sc = document.getElementById('newShopCat');
  if(sc) _formScratch.shopCat = sc.value;
  const sq = document.getElementById('newShopQty');
  if(sq) _formScratch.shopQty = sq.value;
  // Project form
  const pn = document.getElementById('newProjName');
  if(pn) _formScratch.projName = pn.value;
  // Task-def edit form
  const tdT = document.getElementById('edTaskText'); if(tdT) _formScratch.tdText = tdT.value;
  const tdN = document.getElementById('edTaskNote'); if(tdN) _formScratch.tdNote = tdN.value;
  const tdR = document.getElementById('edTaskRoll'); if(tdR) _formScratch.tdRoll = tdR.checked;
  const tdD = document.getElementById('edTaskDay');  if(tdD) _formScratch.tdDay  = tdD.value;
  const tdB = document.getElementById('edTaskBonus');if(tdB) _formScratch.tdBonus= tdB.value;
  // Add-task form
  const atT = document.getElementById('addTaskText'); if(atT) _formScratch.atText = atT.value;
  const atN = document.getElementById('addTaskNote'); if(atN) _formScratch.atNote = atN.value;
  const atR = document.getElementById('addTaskRoll'); if(atR) _formScratch.atRoll = atR.checked;
  const atD = document.getElementById('addTaskDay');  if(atD) _formScratch.atDay  = atD.value;
  const atB = document.getElementById('addTaskBonus');if(atB) _formScratch.atBonus= atB.value;
}

// === Toggle wrapper — captures event for particle FX (step 3) ===
window._tog = (p, sc, tid, ev) => {
  const k = scopeKey(sc);
  const wasChecked = !!(state[p]?.[sc]?.[k]?.[tid]);
  if(!wasChecked && ev){
    const card = ev.currentTarget;
    const cb = card && card.querySelector ? card.querySelector('.task-check') : null;
    if(cb){
      const r = cb.getBoundingClientRect();
      const px = PEOPLE[p] || PEOPLE_META[p];
      const hex = px?.hex || '#c8a84a';
      spawnParticles(r.left + r.width/2, r.top + r.height/2, hex);
      cb.classList.add('pop');
    }
  }
  toggleTask(p, sc, tid);
};
window._note = (p,t) => saveNote(p,t);
window._rst  = (sc) => resetScope(sc);
window._add  = (p,sc) => {
  const el = document.getElementById(`ai_${p}_${sc}`); if(!el) return;
  const bEl = document.getElementById(`aib_${p}_${sc}`);
  const bonus = bEl ? bEl.value : '';
  addTask(p, sc, el.value, bonus);
  el.value = ''; if(bEl) bEl.value = '';
};
window._rm   = (p,sc,tid) => removeTask(p,sc,tid);
window._hd   = (p) => toggleHardDay(p);
window._togNote = (btn) => { const card = btn.closest('.task-card'); if(card) card.classList.toggle('show-note'); };
window._togMore = (btn) => {
  const el = document.getElementById(btn.dataset.rid);
  if(!el) return;
  const showing = el.style.display !== 'none';
  el.style.display = showing ? 'none' : 'block';
  btn.textContent = showing ? btn.dataset.more : btn.dataset.less;
};

// Form open/close + submit handlers
window._openForm = (which) => {
  _formOpen = which; _editing = null; _formScratch = {};
  renderCurrent();
  setTimeout(() => {
    const ids = {addChore:'newChoreText', addProject:'newProjName', addShop:'newShopName'};
    const el = document.getElementById(ids[which]); if(el) el.focus();
  }, 50);
};
window._closeForm = () => { _formOpen = null; _editing = null; _formScratch = {}; renderCurrent(); };

// Chores
window._togChore = (id, day) => toggleChoreCheck(id, day);
window._editChore = (id) => {
  _editing = {kind:'chore', id};
  _formOpen = null;
  _formScratch = {};
  renderCurrent();
  document.getElementById('addChoreForm')?.scrollIntoView({behavior:'smooth', block:'center'});
};
window._cancelChore = () => { _editing = null; _formOpen = null; _formScratch = {}; renderCurrent(); };
window._submitChore = async () => {
  const text = document.getElementById('newChoreText')?.value || '';
  const day = document.getElementById('newChoreDay')?.value || 'daily';
  const assignees = [...document.querySelectorAll('#newChoreAsg .asg-chip.on')].map(c => c.dataset.p);
  if(!text.trim() || !assignees.length){ alert('Need a description and at least one assignee.'); return; }
  if(_editing && _editing.kind === 'chore'){
    await updateChore(_editing.id, {text:text.trim(), day, assignees});
  } else {
    await addChore(text, assignees, day);
  }
  _editing = null; _formOpen = null; _formScratch = {};
};
window._delChore = (id) => deleteChore(id);

// Projects
window._togProj = (id) => {
  // Toggle expand inline
  _editing = (_editing && _editing.kind==='project' && _editing.id===id) ? null : {kind:'project', id};
  renderCurrent();
};
window._cyProj = (id) => cycleProjectStatus(id);
window._renProj = async (id) => {
  const p = projects?.projects.find(p => p.id === id); if(!p) return;
  const name = prompt('Rename project:', p.name);
  if(name && name.trim() && name !== p.name) await renameProject(id, name);
};
window._delProj = (id) => deleteProject(id);
window._submitProject = async () => {
  const name = document.getElementById('newProjName')?.value || '';
  if(!name.trim()){ alert('Need a project name.'); return; }
  await addProject(name);
  _formOpen = null; _formScratch = {};
};
window._addPT = async (projId) => {
  const text = document.getElementById('newPTtext_'+projId)?.value || '';
  const assignees = [...document.querySelectorAll('#newPTasg_'+projId+' .asg-chip.on')].map(c => c.dataset.p);
  const bonus = document.getElementById('newPTbonus_'+projId)?.value || '';
  if(!text.trim()) return;
  await addProjectTask(projId, text, assignees, bonus);
};
window._togPT = (projId, tid) => toggleProjectTask(projId, tid);
window._rmPT = (projId, tid) => removeProjectTask(projId, tid);

// Shopping
window._submitShop = async () => {
  const name = document.getElementById('newShopName')?.value || '';
  const cat = document.getElementById('newShopCat')?.value || SHOP_CATS[0].key;
  const qty = document.getElementById('newShopQty')?.value || '';
  if(!name.trim()){ alert('Need an item name.'); return; }
  await addShopItem(name, cat, qty);
  _formOpen = null; _formScratch = {};
};
window._togLow = (id) => toggleShopLow(id);
window._setQty = (id, q) => updateShopQty(id, q);
window._rmShop = (id) => removeShopItem(id);

// === Task-def editor handlers (step 12) ===
window._toggleEditMode = () => {
  _editMode = !_editMode;
  _editing = null; _formOpen = null; _formScratch = {};
  renderCurrent();
};
window._editTask = (pid, sc, tid) => {
  _editing = {kind:'taskDef', pid, sc, tid};
  _formOpen = null; _formScratch = {};
  renderCurrent();
};
window._cancelTaskDef = () => { _editing = null; _formScratch = {}; renderCurrent(); };
window._submitTaskDef = async () => {
  if(!_editing || _editing.kind !== 'taskDef') return;
  const text = document.getElementById('edTaskText')?.value || '';
  if(!text.trim()){ alert('Task needs text.'); return; }
  const note = document.getElementById('edTaskNote')?.value || '';
  const patch = {text: text.trim(), note};
  if(_editing.sc === 'today'){
    patch.rollover = document.getElementById('edTaskRoll')?.checked || false;
  }
  if(_editing.sc === 'week'){
    patch.day = document.getElementById('edTaskDay')?.value || '';
  }
  // Bonus only present on earners' edit forms
  const bonusEl = document.getElementById('edTaskBonus');
  if(bonusEl) patch.bonus = bonusEl.value;
  const {pid, sc, tid} = _editing;
  _editing = null; _formScratch = {};
  await editTaskDef(pid, sc, tid, patch);
};
window._delTask = async (pid, sc, tid) => {
  await deleteTaskDef(pid, sc, tid);
  if(_editing && _editing.tid === tid){ _editing = null; _formScratch = {}; renderCurrent(); }
};
window._addToGroup = (pid, sc, groupName) => {
  _editing = {kind:'addTask', pid, sc, group: groupName || null};
  _formOpen = null; _formScratch = {};
  renderCurrent();
  setTimeout(()=>document.getElementById('addTaskText')?.focus(), 50);
};
window._submitAddTask = async () => {
  if(!_editing || _editing.kind !== 'addTask') return;
  const text = document.getElementById('addTaskText')?.value || '';
  if(!text.trim()){ alert('Task needs text.'); return; }
  const note = document.getElementById('addTaskNote')?.value || '';
  const opts = { text: text.trim(), group: _editing.group, note };
  if(_editing.sc === 'today') opts.rollover = document.getElementById('addTaskRoll')?.checked || false;
  if(_editing.sc === 'week')  opts.day = document.getElementById('addTaskDay')?.value || '';
  const bonusEl = document.getElementById('addTaskBonus');
  if(bonusEl) opts.bonus = bonusEl.value;
  const {pid, sc} = _editing;
  _editing = null; _formScratch = {};
  await addTaskDef(pid, sc, opts);
};
window._addGroup = async (pid) => {
  const name = prompt('New group name (e.g. "Morning", "Evening", "After School"):');
  if(name && name.trim()) await addGroupToToday(pid, name.trim(), false);
};
window._renGroup = async (pid, oldName) => {
  const name = prompt('Rename group:', oldName);
  if(name && name.trim() && name !== oldName) await renameGroup(pid, oldName, name.trim());
};
window._delGroup = (pid, groupName) => deleteGroup(pid, groupName);

function updateDate(){
  const d=new Date();
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const el=document.getElementById('hDate');
  if(el) el.textContent=`${days[d.getDay()]} ${mo[d.getMonth()]} ${d.getDate()}`;
}

let _lastTimeGroup = timeGroupNow();
setInterval(()=>{
  const g = timeGroupNow();
  if(g !== _lastTimeGroup){
    _lastTimeGroup = g;
    refreshView();
  }
}, 60000);

function init(){
  syncSt('syncing');
  setupNotifications();
  let shown=false;
  window._showApp=function(){
    if(shown || !TASK_DEFS) return; shown=true;
    document.getElementById('ls').style.display='none';
    buildNav(); updateTabBarVisibility(); updateDate(); renderCurrent(); syncSt('synced');
  };
  subscribeTaskDefs();
  setTimeout(()=>{
    if(!shown) document.getElementById('lmsg').textContent='Still connecting... please wait';
  }, 3000);
  setTimeout(()=>{
    if(shown) return;
    if(!TASK_DEFS){
      console.warn('TASK_DEFS not loaded after 6s — falling back to local defaults');
      TASK_DEFS = DEFAULT_TASK_DEFS;
      rebuildPEOPLE();
      if(!_checksSubscribed){ _checksSubscribed = true; subscribeAll(); }
    }
    window._showApp();
  }, 6000);
}
init();
setInterval(updateDate,60000);
</script>
