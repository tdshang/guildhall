<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Guild Hall · Household Command Center</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --tina:#7B4FBF;--tina-glow:rgba(123,79,191,0.25);--tina-soft:rgba(123,79,191,0.08);
  --mark:#2E7D52;--mark-glow:rgba(46,125,82,0.25);--mark-soft:rgba(46,125,82,0.08);
  --connor:#C4501A;--connor-glow:rgba(196,80,26,0.25);--connor-soft:rgba(196,80,26,0.08);
  --walker:#1A6FA8;--walker-glow:rgba(26,111,168,0.25);--walker-soft:rgba(26,111,168,0.08);
  --gabe:#8A7320;--gabe-glow:rgba(138,115,32,0.25);--gabe-soft:rgba(138,115,32,0.08);
  --bg:#0e0d0b;--surface:#141210;--card:#1c1914;
  --border:rgba(200,180,140,0.1);--border-hi:rgba(200,180,140,0.25);
  --text:#e8e0d0;--text-dim:#8a7f6e;--text-faint:#4a4438;
  --gold:#c8a84a;--gold-dim:rgba(200,168,74,0.12);
  --red:#c0392b;--red-soft:rgba(192,57,43,0.12);
  --success:#27ae60;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Crimson Text',Georgia,serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:16px;line-height:1.5;overflow-x:hidden}

.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:14px}
.loading-title{font-family:'Cinzel',serif;font-size:22px;color:var(--gold);letter-spacing:0.12em}
.loading-sub{font-size:13px;color:var(--text-dim);font-style:italic}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.app-header{position:sticky;top:0;z-index:100;background:rgba(14,13,11,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px}
.header-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;height:54px}
.app-logo{font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:0.12em;color:var(--gold);text-transform:uppercase;flex-shrink:0}
.app-logo span{color:var(--text-dim);font-weight:400;font-size:10px}
.sync-wrap{display:flex;align-items:center;gap:5px;margin-left:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);transition:background 0.3s}
.sync-dot.synced{background:var(--success)}.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite}.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.sync-lbl{font-size:10px;color:var(--text-faint);font-family:'Cinzel',serif;letter-spacing:0.06em}
.header-date{margin-left:auto;font-size:10px;color:var(--text-dim);font-family:'Cinzel',serif;letter-spacing:0.05em;text-align:right}

.nav-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:54px;z-index:99}
.nav-scroll::-webkit-scrollbar{display:none}
.nav-inner{display:flex;gap:4px;padding:7px 14px;width:max-content;min-width:100%}
.nav-pill{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:5px 14px;border-radius:18px;border:1px solid var(--border);color:var(--text-dim);background:transparent;cursor:pointer;white-space:nowrap;transition:all 0.2s;flex-shrink:0}
.nav-pill:hover{border-color:var(--border-hi);color:var(--text)}
.nav-pill.active{color:white;border-color:transparent}
.nav-pill[data-p="tina"].active{background:var(--tina);box-shadow:0 0 10px var(--tina-glow)}
.nav-pill[data-p="mark"].active{background:var(--mark);box-shadow:0 0 10px var(--mark-glow)}
.nav-pill[data-p="connor"].active{background:var(--connor);box-shadow:0 0 10px var(--connor-glow)}
.nav-pill[data-p="walker"].active{background:var(--walker);box-shadow:0 0 10px var(--walker-glow)}
.nav-pill[data-p="gabe"].active{background:var(--gabe);box-shadow:0 0 10px var(--gabe-glow)}
.nav-pill[data-p="command"].active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}

.tab-wrap{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:98px;z-index:98}
.tab-bar{max-width:860px;margin:0 auto;display:flex}
.tab-btn{flex:1;padding:10px 6px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-dim);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}
.tab-btn.active{color:var(--text);border-bottom-color:var(--gold)}
.tab-btn:hover{color:var(--text)}

.main{max-width:860px;margin:0 auto;padding:16px 14px 80px}
.tab-panel{display:none;animation:fadeIn 0.2s ease}
.tab-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.person-hero{border-radius:var(--radius);padding:16px;margin-bottom:16px;border:1px solid var(--border)}
.hero-name{font-family:'Cinzel',serif;font-size:22px;font-weight:700;letter-spacing:0.04em}
.hero-role{font-size:12px;color:var(--text-dim);margin-top:1px;font-style:italic}
.hero-stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stat-box{background:rgba(0,0,0,0.3);border-radius:6px;padding:7px 12px;text-align:center;flex:1;min-width:55px;border:1px solid rgba(255,255,255,0.05)}
.stat-val{font-family:'Cinzel',serif;font-size:18px;font-weight:700;line-height:1}
.stat-lbl{font-size:8px;color:var(--text-dim);letter-spacing:0.1em;text-transform:uppercase;margin-top:2px}

.sec-head{display:flex;align-items:center;gap:8px;margin:16px 0 8px;transition:opacity 0.3s}
.sec-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;transition:color 0.3s,text-shadow 0.3s}
.sec-line{flex:1;height:1px;background:var(--border);transition:background 0.3s,opacity 0.3s}
.sec-count{font-family:'Cinzel',serif;font-size:9px;color:var(--text-faint)}
.sec-head.now .sec-lbl{color:var(--gold);text-shadow:0 0 8px var(--gold-dim)}
.sec-head.now .sec-line{background:linear-gradient(90deg,var(--gold),transparent);opacity:0.6}
.sec-head.dim{opacity:0.45}
.sec-head.dim .sec-lbl{color:var(--text-faint)}

.task-card{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;user-select:none;transition:border-color 0.15s,opacity 0.3s}
.task-card:active{opacity:0.7}
.task-card.done{opacity:0.45}
.task-card.dim{opacity:0.3}
.task-inner{display:flex;align-items:center;gap:10px;padding:11px 13px}
.task-check{width:20px;height:20px;border-radius:4px;flex-shrink:0;border:2px solid var(--border-hi);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.15s}
.task-check.pop{animation:checkPop 380ms cubic-bezier(0.34,1.56,0.64,1)}
@keyframes checkPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.task-text{flex:1;font-size:13.5px;line-height:1.3}
.task-card.done .task-text{text-decoration:line-through;color:var(--text-dim)}
.rollover-badge{font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.06em;color:#e74c3c;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.25);border-radius:8px;padding:1px 6px;flex-shrink:0}
.remove-btn{opacity:0;font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;padding:0 4px;transition:opacity 0.15s;flex-shrink:0}
.task-card:hover .remove-btn{opacity:0.6}
.remove-btn:hover{opacity:1!important}
.task-meta{font-size:10px;color:var(--text-faint);padding:0 13px 8px 45px;font-style:italic;display:none}
.task-card.done .task-meta{display:block}

.task-note-btn{opacity:0.55;font-size:11px;color:var(--text-dim);background:none;border:1px solid var(--border);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;transition:all 0.15s;line-height:1}
.task-note-btn:hover{opacity:1;border-color:var(--gold);color:var(--gold)}
.task-card.show-note .task-note-btn{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);opacity:1}
.task-note{padding:8px 13px 11px 45px;color:var(--text-dim);font-size:12px;line-height:1.45;font-style:italic;border-top:1px dashed var(--border);display:none;background:rgba(0,0,0,0.15)}
.task-card.show-note .task-note{display:block}

.add-task-row{display:flex;gap:6px;margin-top:6px;margin-bottom:12px}
.add-task-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Crimson Text',Georgia,serif;font-size:13px;outline:none}
.add-task-input:focus{border-color:var(--border-hi)}
.add-task-input::placeholder{color:var(--text-faint)}
.add-task-btn{background:var(--gold-dim);border:1px solid rgba(200,168,74,0.25);color:var(--gold);border-radius:8px;padding:9px 14px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.1em;cursor:pointer;white-space:nowrap;transition:all 0.2s}
.add-task-btn:hover{background:rgba(200,168,74,0.2)}

.notes-area{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:8px}
.notes-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.notes-input{width:100%;background:transparent;border:none;color:var(--text);font-family:'Crimson Text',Georgia,serif;font-size:13px;line-height:1.5;resize:vertical;min-height:60px;outline:none}
.notes-input::placeholder{color:var(--text-faint)}

.alert-card{background:var(--red-soft);border:1px solid rgba(192,57,43,0.35);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.alert-title{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#e74c3c;margin-bottom:8px}

.cmd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:480px){.cmd-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.cmd-grid{grid-template-columns:repeat(5,1fr)}}
.cmd-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform 0.15s,border-color 0.15s}
.cmd-card:hover{transform:translateY(-2px);border-color:var(--border-hi)}
.cmd-hd{padding:9px 11px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:white}
.cmd-bd{padding:10px 11px}
.cmd-bar{height:3px;border-radius:2px;background:rgba(255,255,255,0.08);margin-bottom:7px;overflow:hidden}
.cmd-fill{height:100%;border-radius:2px;transition:width 0.4s}
.cmd-pct{font-family:'Cinzel',serif;font-size:17px;font-weight:700}
.cmd-sub{font-size:10px;color:var(--text-dim);margin-top:1px}
.cmd-flag{font-size:10px;margin-top:3px}

.gold-div{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0;opacity:0.25}
.slip-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:5px;font-size:13px}
.empty-msg{text-align:center;color:var(--text-faint);font-style:italic;font-size:13px;padding:18px}
.reset-btn{background:var(--red-soft);border:1px solid rgba(192,57,43,0.25);color:#e74c3c;border-radius:8px;padding:9px 16px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
.reset-btn:hover{background:rgba(192,57,43,0.2)}
.start-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold-dim);border:1px solid rgba(200,168,74,0.2);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--gold);font-style:italic;margin-bottom:14px}

/* Hard Day mode */
.hd-toggle{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border-hi);color:var(--text-dim);padding:6px 13px;border-radius:16px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;margin-top:12px}
.hd-toggle:hover{border-color:var(--gold);color:var(--gold)}
.hd-toggle.on{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
.hd-banner{background:linear-gradient(135deg,var(--gold-dim),transparent);border:1px solid rgba(200,168,74,0.3);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.hd-banner-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.hd-banner-sub{font-size:12px;color:var(--text-dim);font-style:italic}
.hd-exit{color:var(--gold);background:none;border:none;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;padding:0;margin-top:5px;text-decoration:underline;text-decoration-color:rgba(200,168,74,0.3)}
.hd-exit:hover{text-decoration-color:var(--gold)}

/* Rollover banner */
.rollover-bar{background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:8px;padding:11px 13px;margin-bottom:14px}
.rollover-bar-title{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#e74c3c;margin-bottom:4px}
.rollover-bar-list{font-size:12px;color:var(--text-dim);line-height:1.5}
.more-toggle{background:none;border:none;color:var(--text-dim);font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.08em;cursor:pointer;text-transform:uppercase;padding:5px 0 0;display:inline-block;text-decoration:underline;text-decoration-color:var(--border-hi)}
.more-toggle:hover{color:var(--text)}

/* Particle overlay (completion FX) */
#fxOverlay{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;transform:translate(-50%,-50%);will-change:transform,opacity;box-shadow:0 0 8px currentColor}
.particle.fly{animation:particleFly 650ms cubic-bezier(0.2,0.7,0.3,1) forwards}
@keyframes particleFly{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(1)}
  60% {opacity:0.85}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0.2)}
}
</style>
</head>
<body>

<div class="loading-screen" id="ls">
  <div class="spinner"></div>
  <div class="loading-title">Guild Hall</div>
  <div class="loading-sub" id="lmsg">Connecting to household...</div>
</div>

<div class="app-header">
  <div class="header-inner">
    <div class="app-logo">Guild Hall <span>· Command Center</span></div>
    <div class="sync-wrap"><div class="sync-dot" id="syncDot"></div><span class="sync-lbl" id="syncLbl">connecting</span></div>
    <div class="header-date" id="hDate"></div>
  </div>
</div>

<div class="nav-scroll"><div class="nav-inner" id="personNav"></div></div>

<div class="tab-wrap">
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="today"  onclick="switchTab('today')">Today</button>
    <button class="tab-btn"        data-tab="week"   onclick="switchTab('week')">This Week</button>
    <button class="tab-btn"        data-tab="month"  onclick="switchTab('month')">This Month</button>
  </div>
</div>

<div class="main" id="mainContent"></div>

<div id="fxOverlay" aria-hidden="true"></div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDQa6TYIjHwtB-hjO5Z1BPCdC5skDtP9z8",
  authDomain:"guild-hall-76335.firebaseapp.com",
  projectId:"guild-hall-76335",
  storageBucket:"guild-hall-76335.firebasestorage.app",
  messagingSenderId:"243084312308",
  appId:"1:243084312308:web:67712fafbf8e671ba728a1"
};
const db = getFirestore(initializeApp(firebaseConfig));

// START DATE — next Monday. Change the 0,0,0,0 date below to override manually.
const START_DATE = (() => {
  const d = new Date();
  const daysUntil = d.getDay()===1 ? 7 : (8-d.getDay())%7||7;
  d.setDate(d.getDate()+daysUntil); d.setHours(0,0,0,0); return d;
})();
function isStarted(){ return new Date() >= START_DATE; }
function fmtStart(){
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[START_DATE.getDay()]}, ${mo[START_DATE.getMonth()]} ${START_DATE.getDate()}`;
}

function dk(d){ return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function todayK()  { return dk(new Date()); }
function ydayK()   { const d=new Date(); d.setDate(d.getDate()-1); return dk(d); }
function weekK()   { const d=new Date(),m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7)); return dk(m); }
function monthK()  { const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}`; }
function scopeKey(sc){ return sc==='today'?todayK():sc==='week'?weekK():monthK(); }

// === Time-of-day group context (step 2) ===
// Morning: until 11:00. Midday: 11:00–17:00. Evening: 17:00+
function timeGroupNow(){
  const h = new Date().getHours();
  if(h < 11) return 'morning';
  if(h < 17) return 'midday';
  return 'evening';
}
const TIME_ORDER = {morning:1, midday:2, evening:3};
function groupKey(label){
  const s = (label||'').toLowerCase();
  if(s.includes('morning')) return 'morning';
  if(s.includes('midday')||s.includes('noon')||s.includes('afternoon')) return 'midday';
  if(s.includes('evening')||s.includes('night')) return 'evening';
  return null; // 'Daily', 'As Able', 'Priority Watch', alert groups — no time context
}

// === PERSON METADATA (static — colors, roles, names) ===
const PEOPLE_META = {
  tina:  {name:'Tina',  role:'Systems · Laundry · Master Spaces · Oversight',
          color:'var(--tina)',  glow:'var(--tina-glow)',  soft:'var(--tina-soft)',  hex:'#7B4FBF'},
  mark:  {name:'Mark',  role:'Infrastructure · Maintenance · Ventilation · Garage',
          color:'var(--mark)',  glow:'var(--mark-glow)',  soft:'var(--mark-soft)',  hex:'#2E7D52'},
  connor:{name:'Connor',role:'Dogs · Dishes · Kitchen Reset · Bedroom · Boys\' Bathroom',
          color:'var(--connor)',glow:'var(--connor-glow)',soft:'var(--connor-soft)',hex:'#C4501A'},
  walker:{name:'Walker',role:'Cats · Litter · Floors · Dishes Assist · Feeding · Hallway',
          color:'var(--walker)',glow:'var(--walker-glow)',soft:'var(--walker-soft)',hex:'#1A6FA8'},
  gabe:  {name:'Gabe',  role:'Basement · Downstairs Cat · Trash to Road',
          color:'var(--gabe)',  glow:'var(--gabe-glow)',  soft:'var(--gabe-soft)',  hex:'#8A7320'}
};

// === DEFAULT TASK DEFS (seeded into config/taskDefs on first run) ===
// Tasks with rollover:true are critical/non-negotiable; missed yesterday surfaces on today.
// Tasks may have an optional `note` field — small context paragraph, tap to reveal.
const DEFAULT_TASK_DEFS = {
  tina:{
    today:[
      {group:'Morning',tasks:[
        {id:'tm1',text:'Start a load of laundry'},
        {id:'tm2',text:'Paper/mail off counters'},
        {id:'tm3',text:'Master bath quick wipe: sink + toilet'},
        {id:'tm4',text:'Check boys completed yesterday\'s tasks'},
      ]},
      {group:'Evening',tasks:[
        {id:'te1',text:'Move laundry forward (wash → dry → basket)'},
        {id:'te2',text:'15-min clutter reset — one zone, set a timer'},
        {id:'te3',text:'Kitchen island cleared before bed'},
        {id:'te4',text:'Confirm non-negotiables happened'},
        {id:'te5',text:'Master bath: fan on + door open if shower used'},
      ]},
      {group:'⚠ Mold Protocol — Until Vent Fixed',alert:true,tasks:[
        {id:'tmo1',text:'Vinegar spray on bath ceiling every 3–4 days — let dry, do not wipe'},
        {id:'tmo2',text:'Fan ON + door OPEN after every shower',rollover:true},
        {id:'tmo3',text:'No fabric/towels stored in master bathroom'},
      ]},
    ],
    week:[
      {id:'tw1', text:'Monday: Laundry full catch-up',day:'Mon'},
      {id:'tw2', text:'Tuesday: Kitchen deeper pass + pantry check',day:'Tue'},
      {id:'tw3', text:'Wednesday: Vinegar spray master bath ceiling',day:'Wed'},
      {id:'tw4', text:'Wednesday: Later basket sort',day:'Wed'},
      {id:'tw5', text:'Thursday: Clean master bathroom',day:'Thu'},
      {id:'tw6', text:'Friday: Donation bag check + fridge check',day:'Fri'},
      {id:'tw7', text:'Saturday: Declutter target zone',day:'Sat'},

// === LIVE TASK DEFS — loaded from Firestore, mirrors DEFAULT_TASK_DEFS shape ===
let TASK_DEFS = null;
const PEOPLE = {};
let _ROLLOVER_CACHE = new Set();

function rebuildPEOPLE(){
  for(const pid of Object.keys(PEOPLE_META)){
    const defs = (TASK_DEFS && TASK_DEFS[pid]) || {today:[], week:[], month:[]};
    PEOPLE[pid] = {
      ...PEOPLE_META[pid],
      today: defs.today || [],
      week:  defs.week  || [],
      month: defs.month || [],
    };
  }
  _ROLLOVER_CACHE = new Set();
  for(const pid of Object.keys(PEOPLE)){
    PEOPLE[pid].today.forEach(g => (g.tasks||[]).forEach(t => { if(t.rollover) _ROLLOVER_CACHE.add(t.id); }));
  }
}
function isRollover(id){ return _ROLLOVER_CACHE.has(id); }

// STATE
const state={}, notes={}, custom={}, hardDay={};
function ensure(p,sc,k){ if(!state[p])state[p]={}; if(!state[p][sc])state[p][sc]={}; if(!state[p][sc][k])state[p][sc][k]={}; }

const fsCheck =(p,sc,k)=>`checks/${p}/${sc}/${k}`;
const fsNote  =(p)=>`notes/${p}`;
const fsCustom=(p,sc)=>`custom/${p}/${sc}`;
const fsHard  =(p)=>`hardDay/${p}`;

function getChecked(p,sc){ return state[p]?.[sc]?.[scopeKey(sc)]||{}; }
function getYChecked(p){ return state[p]?.today?.[ydayK()]||{}; }

function allTodayTasks(p){ return [...PEOPLE[p].today.flatMap(g=>g.tasks), ...(custom[p]?.today||[])]; }
function allScopeTasks(p,sc){
  if(sc==='today') return allTodayTasks(p);
  return [...(PEOPLE[p][sc==='week'?'week':'month']||[]), ...(custom[p]?.[sc]||[])];
}

function getRollovers(p){
  if(!isStarted()) return new Set();
  const yc=getYChecked(p), tc=getChecked(p,'today'), out=new Set();
  allTodayTasks(p).forEach(t=>{ if(isRollover(t.id)&&!yc[t.id]&&!tc[t.id]) out.add(t.id); });
  return out;
}
function getMissedYday(p){
  if(!isStarted()) return [];
  const yc=getYChecked(p);
  return allTodayTasks(p).filter(t=>!yc[t.id]);
}
function getNote(p){ return notes[p]||''; }
function getCustom(p,sc){ return custom[p]?.[sc]||[]; }

// Returns list of recent attribution-aware completions for a person in scope, newest first.
function recentChecks(p, sc, limit=6){
  const k = scopeKey(sc), m = state[p]?.[sc]?.[k]||{};
  const arr = [];
  for(const [tid, v] of Object.entries(m)){
    if(v && typeof v === 'object' && v.at) arr.push({tid, at:v.at, by:v.by||null});
  }
  arr.sort((a,b)=>b.at - a.at);
  return arr.slice(0, limit);
}
function findTaskText(p, sc, tid){
  const list = sc==='today'
    ? [...PEOPLE[p].today.flatMap(g=>g.tasks), ...(custom[p]?.today||[])]
    : [...(PEOPLE[p][sc==='week'?'week':'month']||[]), ...(custom[p]?.[sc]||[])];
  return list.find(t=>t.id===tid)?.text || tid;
}

function personStats(p){
  const td=allTodayTasks(p),tc=getChecked(p,'today');
  const wk=allScopeTasks(p,'week'),wc=getChecked(p,'week');
  let done=0,total=0;
  td.forEach(t=>{total++;if(tc[t.id])done++;});
  wk.forEach(t=>{total++;if(wc[t.id])done++;});
  return {done,total,pct:total?Math.round(done/total*100):0,
          tDone:td.filter(t=>tc[t.id]).length,tTotal:td.length,
          rolls:getRollovers(p).size};
}

function syncSt(s){
  document.getElementById('syncDot').className='sync-dot '+s;
  document.getElementById('syncLbl').textContent=s==='synced'?'live':s==='syncing'?'saving...':'offline';
}

// === Completion FX — particles (step 3) ===
function spawnParticles(x, y, color){
  const overlay = document.getElementById('fxOverlay');
  if(!overlay) return;
  const colors = [color, '#c8a84a', color, '#c8a84a', '#e8e0d0'];
  const N = 16;
  for(let i=0; i<N; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI*2*i)/N + (Math.random()-0.5)*0.35;
    const dist = 38 + Math.random()*32;
    p.style.left = x+'px'; p.style.top = y+'px';
    p.style.background = colors[i % colors.length];
    p.style.color = colors[i % colors.length];
    p.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    p.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    overlay.appendChild(p);
    // Trigger animation on next frame so the transform takes effect
    requestAnimationFrame(()=>p.classList.add('fly'));
    setTimeout(()=>p.remove(), 720);
  }
}

// === Toggle task — attribution-aware storage (step 4) ===
// Value is object {at, by} when checked; deleted when unchecked. Truthy check still works.
async function toggleTask(p, sc, tid){
  const k = scopeKey(sc); ensure(p,sc,k);
  const cur = state[p][sc][k][tid];
  if(cur){
    delete state[p][sc][k][tid];
  } else {
    state[p][sc][k][tid] = { at: Date.now(), by: (curP==='command' ? 'tina' : curP) };
  }
  syncSt('syncing');
  try{ await setDoc(doc(db,fsCheck(p,sc,k)), state[p][sc][k]); syncSt('synced'); }
  catch(e){ console.error(e); syncSt('error'); }
  refreshView();
}

let nTimer=null;
async function saveNote(p,text){
  notes[p]=text; clearTimeout(nTimer);
  nTimer=setTimeout(async()=>{
    syncSt('syncing');
    try{ await setDoc(doc(db,fsNote(p)),{text,ts:Date.now()}); syncSt('synced'); }
    catch(e){ syncSt('error'); }
  },700);
}

async function addTask(p,sc,text){
  if(!text.trim()) return;
  if(!custom[p]) custom[p]={};
  if(!custom[p][sc]) custom[p][sc]=[];
  const id='c_'+Date.now();
  custom[p][sc].push({id,text:text.trim()});
  syncSt('syncing');
  try{ await setDoc(doc(db,fsCustom(p,sc)),{tasks:custom[p][sc]}); syncSt('synced'); }
  catch(e){ syncSt('error'); }
  refreshView();
}

async function removeTask(p,sc,tid){
  if(!custom[p]?.[sc]) return;
  custom[p][sc]=custom[p][sc].filter(t=>t.id!==tid);
  syncSt('syncing');
  try{ await setDoc(doc(db,fsCustom(p,sc)),{tasks:custom[p][sc]}); syncSt('synced'); }
  catch(e){ syncSt('error'); }
  refreshView();
}

async function resetScope(sc){
  if(!confirm(`Reset all ${sc} checkboxes for everyone?`)) return;
  const k=scopeKey(sc); syncSt('syncing');
  try{
    for(const pid of Object.keys(PEOPLE)){
      ensure(pid,sc,k); state[pid][sc][k]={};
      await setDoc(doc(db,fsCheck(pid,sc,k)),{});
    }
    syncSt('synced'); refreshView();
  }catch(e){ syncSt('error'); }
}

// === Hard Day mode (step 5) — persisted per person per day ===
async function toggleHardDay(p){
  const on = !hardDay[p];
  hardDay[p] = on;
  syncSt('syncing');
  try{
    await setDoc(doc(db,fsHard(p)), on ? {date:todayK(), ts:Date.now()} : {});
    syncSt('synced');
  }catch(e){ syncSt('error'); }
  refreshView();
}

let _checksSubscribed = false;
function subscribeAll(){
  const pairs=[{sc:'today',k:todayK()},{sc:'today',k:ydayK()},{sc:'week',k:weekK()},{sc:'month',k:monthK()}];
  Object.keys(PEOPLE).forEach(pid=>{
    pairs.forEach(({sc,k})=>{
      onSnapshot(doc(db,fsCheck(pid,sc,k)),snap=>{
        ensure(pid,sc,k); state[pid][sc][k]=snap.exists()?snap.data():{};
        syncSt('synced');
        if(window._showApp) window._showApp();
        if(curP===pid||curP==='command') refreshView();
      },e=>{ console.error(e); syncSt('error'); });
    });
    onSnapshot(doc(db,fsNote(pid)),snap=>{ notes[pid]=snap.exists()?(snap.data().text||''):''; if(curP===pid||curP==='command') refreshView(); });
    ['today','week','month'].forEach(sc=>{
      onSnapshot(doc(db,fsCustom(pid,sc)),snap=>{
        if(!custom[pid]) custom[pid]={};
        custom[pid][sc]=snap.exists()?(snap.data().tasks||[]):[];
        if(curP===pid||curP==='command') refreshView();
      });
    });
    // Hard Day (step 5)
    onSnapshot(doc(db,fsHard(pid)),snap=>{
      const d = snap.exists() ? snap.data().date : null;
      hardDay[pid] = (d === todayK());
      if(curP===pid||curP==='command') refreshView();
    });
  });
}

// === Subscribe to config/taskDefs; seed defaults on first run if missing ===
function subscribeTaskDefs(){
  onSnapshot(doc(db,'config/taskDefs'), async snap => {
    if(!snap.exists()){
      try{
        syncSt('syncing');
        await setDoc(doc(db,'config/taskDefs'), DEFAULT_TASK_DEFS);
        // onSnapshot will re-fire with seeded data
      }catch(e){
        console.error('Seed taskDefs failed', e);
        syncSt('error');
      }
      return;
    }
    TASK_DEFS = snap.data();
    rebuildPEOPLE();
    if(!_checksSubscribed){ _checksSubscribed = true; subscribeAll(); }
    if(window._showApp) window._showApp();
    refreshView();
  }, e => { console.error('taskDefs subscribe error', e); syncSt('error'); });
}

// === RENDER HELPERS ===
function escAttr(s){ return (s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts), h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  const hr = ((h+11)%12)+1; return `${hr}:${m}${h<12?'a':'p'}`;
}

function taskCard(p, sc, task, rolls, canRemove){
  const chk = getChecked(p,sc), checkedVal = chk[task.id], done = !!checkedVal;
  const roll = rolls.has(task.id);
  const px = PEOPLE[p];
  const chkSt = done
    ? `background:${px.color};border-color:${px.color};box-shadow:0 0 6px ${px.glow}`
    : roll ? `border-color:#e74c3c;box-shadow:0 0 4px rgba(231,76,60,0.3)` : '';
  const bdr  = roll && !done ? 'border-color:rgba(231,76,60,0.3)' : '';
  const badge = roll && !done ? `<span class="rollover-badge">missed yesterday</span>` : '';
  const noteText = task.note ? escHtml(task.note) : '';
  const noteBtn = noteText
    ? `<button class="task-note-btn" onclick="event.stopPropagation();window._togNote(this)" title="Show context">i</button>` : '';
  const noteBlock = noteText ? `<div class="task-note">${noteText}</div>` : '';
  const rmBtn = canRemove
    ? `<button class="remove-btn" onclick="event.stopPropagation();window._rm('${p}','${sc}','${task.id}')" title="Remove">✕</button>` : '';
  // Attribution meta (only shown on completed tasks via CSS)
  let meta = '';
  if(done && typeof checkedVal === 'object'){
    const by = checkedVal.by && PEOPLE_META[checkedVal.by] ? PEOPLE_META[checkedVal.by].name : (checkedVal.by||'');
    const at = fmtTime(checkedVal.at);
    if(by || at) meta = `<div class="task-meta">${by?'by '+by:''}${by&&at?' · ':''}${at||''}</div>`;
  }
  return `<div class="task-card${done?' done':''}" style="${bdr}" onclick="window._tog('${p}','${sc}','${task.id}',event)">
    <div class="task-inner">
      <div class="task-check" style="${chkSt}">${done?'✓':''}</div>
      <div class="task-text">${escHtml(task.text)}</div>
      ${badge}${noteBtn}${rmBtn}
    </div>
    ${noteBlock}${meta}
  </div>`;
}

function secH(label, count, stateCls){
  const cls = stateCls ? ' '+stateCls : '';
  return `<div class="sec-head${cls}"><div class="sec-lbl">${escHtml(label)}</div><div class="sec-line"></div>${count!==undefined?`<div class="sec-count">${count}</div>`:''}</div>`;
}

function addRow(p,sc){
  return `<div class="add-task-row"><input class="add-task-input" id="ai_${p}_${sc}" placeholder="Add a task..." onkeydown="if(event.key==='Enter')window._add('${p}','${sc}')"><button class="add-task-btn" onclick="window._add('${p}','${sc}')">+ Add</button></div>`;
}

// === Render rollover banner with 3-cap + show-more (step 6) ===
function renderRolloverBanner(p, rolls){
  if(rolls.size === 0) return '';
  const items = allTodayTasks(p).filter(t => rolls.has(t.id))
    .map(t => t.text.split('—')[0].trim());
  const head = items.slice(0,3), rest = items.slice(3);
  let html = `<div class="rollover-bar">
    <div class="rollover-bar-title">⚠ ${rolls.size} rolled over from yesterday</div>
    <div class="rollover-bar-list">${escHtml(head.join(', '))}`;
  if(rest.length){
    const restId = `rovMore_${p}_${Date.now()}`;
    html += `<div id="${restId}" style="display:none;margin-top:4px">${escHtml(rest.join(', '))}</div>
      <button class="more-toggle" data-rid="${restId}" data-more="+${rest.length} more" data-less="hide ${rest.length}" onclick="window._togMore(this)">+${rest.length} more</button>`;
  }
  html += '</div></div>';
  return html;
}

function renderPerson(p){
  const px = PEOPLE[p], st = personStats(p), rolls = getRollovers(p), started = isStarted();
  const hd = !!hardDay[p];
  const nowGrp = timeGroupNow();

  let hero = `<div class="person-hero" style="background:linear-gradient(135deg,${px.soft},transparent);border-color:${px.glow}">
    <div class="hero-name" style="color:${px.color}">${px.name}</div>
    <div class="hero-role">${px.role}</div>
    <div class="hero-stats">
      <div class="stat-box"><div class="stat-val" style="color:${px.color}">${st.tDone}</div><div class="stat-lbl">Done Today</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${px.color}">${st.tTotal-st.tDone}</div><div class="stat-lbl">Remaining</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${rolls.size>0?'#e74c3c':px.color}">${rolls.size}</div><div class="stat-lbl">Rolled Over</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${px.color}">${st.pct}%</div><div class="stat-lbl">Week</div></div>
    </div>
    <button class="hd-toggle${hd?' on':''}" onclick="window._hd('${p}')">${hd?'✓ Hard Day · essentials only':'Hard Day — essentials only'}</button>
  </div>`;

  if(!started){
    hero += `<div class="start-badge">⏳ System starts ${fmtStart()} — no missed indicators yet</div>`;
  } else {
    hero += renderRolloverBanner(p, rolls);
  }

  // TODAY
  let T = hero;
  if(hd){
    T += `<div class="hd-banner">
      <div class="hd-banner-title">Hard Day — Essentials Only</div>
      <div class="hd-banner-sub">Showing critical tasks. Everything else can wait. This is permission, not punishment.</div>
      <button class="hd-exit" onclick="window._hd('${p}')">exit hard day</button>
    </div>`;
  }

  px.today.forEach(g=>{
    const tasks = hd ? (g.tasks||[]).filter(t => t.rollover) : (g.tasks||[]);
    if(!tasks.length) return;
    const tg = groupKey(g.group);
    let stateCls = '';
    if(tg && TIME_ORDER[tg]){
      if(tg === nowGrp) stateCls = 'now';
      else if(TIME_ORDER[tg] < TIME_ORDER[nowGrp]){
        const grpDone = tasks.every(t => getChecked(p,'today')[t.id]);
        if(grpDone) stateCls = 'dim';
      }
    }
    if(g.alert){
      T += `<div class="alert-card"><div class="alert-title">${escHtml(g.group)}</div>`;
      tasks.forEach(t => T += taskCard(p,'today',t,rolls,false));
      T += `</div>`;
    } else {
      T += secH(g.group, undefined, stateCls);
      tasks.forEach(t => T += taskCard(p,'today',t,rolls,false));
    }
  });
  const ct = getCustom(p,'today');
  if(ct.length){
    T += secH('My Added Tasks');
    ct.forEach(t => T += taskCard(p,'today',t,rolls,true));
  }
  T += addRow(p,'today');
  T += `${secH('Notes for Tina + Mark')}<div class="notes-area"><textarea class="notes-input" placeholder="Anything to flag? Tap to type..." oninput="window._note('${p}',this.value)">${escHtml(getNote(p))}</textarea></div>`;

  // WEEK
  const wt = allScopeTasks(p,'week'), wd = wt.filter(t => getChecked(p,'week')[t.id]).length;
  let W = secH('This Week\'s Tasks',`${wd}/${wt.length}`);
  px.week.forEach(t => W += taskCard(p,'week',t,new Set(),false));
  const cw = getCustom(p,'week');
  if(cw.length){ W += secH('My Added Tasks'); cw.forEach(t => W += taskCard(p,'week',t,new Set(),true)); }
  W += addRow(p,'week');

  // MONTH
  const mt = allScopeTasks(p,'month'), md = mt.filter(t => getChecked(p,'month')[t.id]).length;
  let M = secH('This Month\'s Tasks',`${md}/${mt.length}`);
  px.month.forEach(t => M += taskCard(p,'month',t,new Set(),false));
  const cm = getCustom(p,'month');
  if(cm.length){ M += secH('My Added Tasks'); cm.forEach(t => M += taskCard(p,'month',t,new Set(),true)); }
  M += addRow(p,'month');

  return {T,W,M};
}

function renderCommand(){
  const pids=Object.keys(PEOPLE), started=isStarted();
  let T=`<div style="font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--gold);margin-bottom:4px">⚔ Command Center</div>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:14px;font-style:italic">Tina + Mark · Live Sync · All Devices</div>`;
  if(!started) T+=`<div class="start-badge" style="margin-bottom:14px">⏳ System officially starts ${fmtStart()}</div>`;

  T+=`<div class="cmd-grid">`;
  pids.forEach(pid=>{
    const px=PEOPLE[pid],st=personStats(pid),rolls=getRollovers(pid);
    const missed=getMissedYday(pid).filter(t=>!isRollover(t.id));
    const hasNote=!!getNote(pid).trim();
    const hd = !!hardDay[pid];
    T+=`<div class="cmd-card" onclick="window._goto('${pid}')">
      <div class="cmd-hd" style="background:${px.color}">${px.name}</div>
      <div class="cmd-bd">
        <div class="cmd-bar"><div class="cmd-fill" style="width:${st.pct}%;background:${px.color}"></div></div>
        <div class="cmd-pct" style="color:${px.color}">${st.pct}%</div>
        <div class="cmd-sub">${st.tDone}/${st.tTotal} today</div>
        ${started&&rolls.size>0?`<div class="cmd-flag" style="color:#e74c3c">⚠ ${rolls.size} rolled over</div>`:''}
        ${started&&missed.length>0?`<div class="cmd-flag" style="color:var(--text-faint)">○ ${missed.length} missed yday</div>`:''}
        ${hasNote?`<div class="cmd-flag" style="color:var(--gold)">📝 note</div>`:''}
        ${hd?`<div class="cmd-flag" style="color:var(--gold)">⚑ Hard Day</div>`:''}
      </div></div>`;
  });
  T+=`</div><div class="gold-div"></div>`;

  if(started){
    T+=secH('Missed Yesterday — Detail');
    T+=`<div style="font-size:11px;color:var(--text-faint);margin-bottom:8px;font-style:italic">Rolled-over items show on each person's own list. Everything else visible here only.</div>`;
    let any=false;
    pids.forEach(pid=>{
      const m=getMissedYday(pid); if(!m.length) return; any=true;
      const px=PEOPLE[pid];
      const cr=m.filter(t=>isRollover(t.id)), ot=m.filter(t=>!isRollover(t.id));
      T+=`<div class="slip-item"><strong style="color:${px.color}">${px.name}</strong>
        ${cr.length?`<div style="margin-top:4px;font-size:12px;color:#e74c3c">Critical (rolled over): ${escHtml(cr.map(t=>t.text.split('—')[0].trim()).join(' · '))}</div>`:''}
        ${ot.length?`<div style="margin-top:3px;font-size:12px;color:var(--text-dim)">Other missed: ${escHtml(ot.map(t=>t.text.split('—')[0].trim()).join(' · '))}</div>`:''}
      </div>`;
    });
    if(!any) T+=`<div class="empty-msg">Nothing missed yesterday 🏆</div>`;
    T+=`<div class="gold-div"></div>`;
  }

  // Recent activity (step 4)
  T += secH('Recent Activity — Today');
  const allRecent = [];
  pids.forEach(pid => {
    recentChecks(pid,'today',10).forEach(r => allRecent.push({pid, ...r}));
  });
  allRecent.sort((a,b) => b.at - a.at);
  const slice = allRecent.slice(0, 8);
  if(slice.length){
    slice.forEach(r => {
      const px = PEOPLE[r.pid], byName = r.by && PEOPLE_META[r.by] ? PEOPLE_META[r.by].name : (r.by||'');
      const txt = findTaskText(r.pid,'today',r.tid);
      const sameActor = r.by === r.pid;
      const byStr = byName ? (sameActor ? '' : ` <span style="color:var(--text-faint)">via ${escHtml(byName)}</span>`) : '';
      T += `<div class="slip-item">
        <span style="font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.08em;color:var(--text-faint)">${fmtTime(r.at)}</span>
        <strong style="color:${px.color};margin-left:8px">${px.name}</strong>${byStr}
        <div style="margin-top:3px;color:var(--text-dim);font-size:12px">${escHtml(txt)}</div>
      </div>`;
    });
  } else {
    T += `<div class="empty-msg">No completions logged yet today.</div>`;
  }
  T += `<div class="gold-div"></div>`;

  T+=secH('Active Notes from Household');
  let anyN=false;
  pids.forEach(pid=>{ const n=getNote(pid); if(!n.trim()) return; anyN=true; T+=`<div class="slip-item"><strong style="color:${PEOPLE[pid].color}">${PEOPLE[pid].name}</strong><div style="margin-top:4px;color:var(--text-dim)">${escHtml(n)}</div></div>`; });
  if(!anyN) T+=`<div class="empty-msg">No notes today.</div>`;
  T+=`<div class="gold-div"></div>`;

  T+=secH('Minimum Viable — Hard Week Standard');
  T+=`<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;font-style:italic">If these are done, the house is functioning. That is enough.</div>`;
  [{id:'mvs1',text:'All animals have clean water'},{id:'mvs2',text:'Both cat litters scooped 3x today'},{id:'mvs3',text:'Hearth pee pad replaced'},{id:'mvs4',text:'Trash removed'},{id:'mvs5',text:'Dishes washed + dried + put away'},{id:'mvs6',text:'One load of laundry moved'},{id:'mvs7',text:'Main floors swept'},{id:'mvs8',text:'Bathrooms ventilated'}]
    .forEach(t=>T+=taskCard('tina','today',t,new Set(),false));
  T+=`<div class="gold-div"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="reset-btn" onclick="window._rst('today')">Reset Today's Checks</button><button class="reset-btn" onclick="window._rst('week')">Reset This Week</button><div style="font-size:11px;color:var(--text-faint);font-style:italic;margin-top:4px">Daily resets automatically at midnight.</div></div>`;

  let W=secH('Sunday Review Questions');
  [{id:'rv1',text:'What consistently didn\'t happen this week?'},{id:'rv2',text:'Task unclear, or capacity issue?'},{id:'rv3',text:'Anything to reassign or simplify?'},{id:'rv4',text:'What one thing made the biggest difference?'},{id:'rv5',text:'Mold protocol still running? Fan habit holding?'},{id:'rv6',text:'Litter schedule on track?'}]
    .forEach(t=>W+=taskCard('mark','week',t,new Set(),false));

  let M=secH('Monthly Household Tasks');
  [{id:'hmo1',text:'Windows cleaned'},{id:'hmo2',text:'Ceiling fans cleaned'},{id:'hmo3',text:'Baseboards — main areas'},{id:'hmo4',text:'Donation haul completed'},{id:'hmo5',text:'HVAC filter checked (Mark)'},{id:'hmo6',text:'Air purifier filter checked (Mark)'},{id:'hmo7',text:'Pet litter pans cleaned outside (Connor + Walker)'}]
    .forEach(t=>M+=taskCard('tina','month',t,new Set(),false));

  return {T,W,M};
}

// ROUTING
let curP='tina', curTab='today';

function buildNav(){
  const nav=document.getElementById('personNav');
  nav.innerHTML=[...Object.keys(PEOPLE),'command'].map(pid=>`<button class="nav-pill${pid===curP?' active':''}" data-p="${pid}" onclick="window._goto('${pid}')">${pid==='command'?'⚔ Command':PEOPLE[pid].name}</button>`).join('');
}

window.switchTab=function(tab){
  curTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  renderCurrent();
};

window._goto=function(p){
  curP=p; buildNav(); renderCurrent(); window.scrollTo({top:0,behavior:'smooth'});
};

function renderCurrent(){
  if(!TASK_DEFS) return;
  const {T,W,M}=curP==='command'?renderCommand():renderPerson(curP);
  document.getElementById('mainContent').innerHTML=`
    <div class="tab-panel${curTab==='today'?' active':''}" id="tp_today">${T}</div>
    <div class="tab-panel${curTab==='week'?' active':''}"  id="tp_week">${W}</div>
    <div class="tab-panel${curTab==='month'?' active':''}" id="tp_month">${M}</div>`;
}

function refreshView(){ if(document.getElementById('ls').style.display==='none') renderCurrent(); }

// === Toggle wrapper — captures event for particle FX (step 3) ===
window._tog = (p, sc, tid, ev) => {
  const k = scopeKey(sc);
  const wasChecked = !!(state[p]?.[sc]?.[k]?.[tid]);
  if(!wasChecked && ev){
    const card = ev.currentTarget;
    const cb = card && card.querySelector ? card.querySelector('.task-check') : null;
    if(cb){
      const r = cb.getBoundingClientRect();
      const px = PEOPLE[p] || PEOPLE_META[p];
      const hex = px?.hex || '#c8a84a';
      spawnParticles(r.left + r.width/2, r.top + r.height/2, hex);
      cb.classList.add('pop');
    }
  }
  toggleTask(p, sc, tid);
};
window._note = (p,t) => saveNote(p,t);
window._rst  = (sc) => resetScope(sc);
window._add  = (p,sc) => { const el=document.getElementById(`ai_${p}_${sc}`); if(el){addTask(p,sc,el.value);el.value='';} };
window._rm   = (p,sc,tid) => removeTask(p,sc,tid);
window._hd   = (p) => toggleHardDay(p);
window._togNote = (btn) => { const card = btn.closest('.task-card'); if(card) card.classList.toggle('show-note'); };
window._togMore = (btn) => {
  const el = document.getElementById(btn.dataset.rid);
  if(!el) return;
  const showing = el.style.display !== 'none';
  el.style.display = showing ? 'none' : 'block';
  btn.textContent = showing ? btn.dataset.more : btn.dataset.less;
};

function updateDate(){
  const d=new Date();
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const el=document.getElementById('hDate');
  if(el) el.textContent=`${days[d.getDay()]} ${mo[d.getMonth()]} ${d.getDate()}`;
}

// Re-render every 10 min so time-of-day highlighting moves through the day even if idle.
let _lastTimeGroup = timeGroupNow();
setInterval(()=>{
  const g = timeGroupNow();
  if(g !== _lastTimeGroup){
    _lastTimeGroup = g;
    refreshView();
  }
}, 60000);

function init(){
  syncSt('syncing');
  let shown=false;
  window._showApp=function(){
    if(shown || !TASK_DEFS) return; shown=true;
    document.getElementById('ls').style.display='none';
    buildNav(); updateDate(); renderCurrent(); syncSt('synced');
  };
  subscribeTaskDefs();
  setTimeout(()=>{
    if(!shown) document.getElementById('lmsg').textContent='Still connecting... please wait';
  }, 3000);
  setTimeout(()=>{
    if(shown) return;
    if(!TASK_DEFS){
      console.warn('TASK_DEFS not loaded after 6s — falling back to local defaults');
      TASK_DEFS = DEFAULT_TASK_DEFS;
      rebuildPEOPLE();
      if(!_checksSubscribed){ _checksSubscribed = true; subscribeAll(); }
    }
    window._showApp();
  }, 6000);
}
init();
setInterval(updateDate,60000);
</script>
